<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#040405">
<meta name="description" content="TwoFold - four small private apps for two people. Works offline.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TwoFold">
<title>TwoFold</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --ink:#f6f6f8; --ink2:rgba(246,246,248,.66); --ink3:rgba(246,246,248,.4);
  --line:rgba(255,255,255,.12); --glass:rgba(255,255,255,.06);
  --metal:linear-gradient(180deg,#ffffff 0%,#dcdfe6 40%,#8e929e 100%);
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:#040405;color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
.serif{font-family:var(--serif);font-weight:400}
.metal{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(80% 32% at 50% 0%,rgba(255,255,255,.06),transparent 70%),#040405;contain:strict}
#app{position:relative;z-index:1;max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 12px 4px;min-height:58px;flex:none}
.bar .r{display:flex;justify-content:flex-end}
.bar .bt{text-align:center;font-family:var(--serif);font-size:18px;letter-spacing:.02em;color:var(--ink)}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:background .2s,color .2s}
.ib:active,.ib:focus-visible{background:var(--glass);color:#fff;outline:none}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 22px 24px;display:flex;flex-direction:column;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#screen::-webkit-scrollbar{display:none}
#screen.enter>*{animation:in .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.spacer{flex:1;min-height:14px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;flex:none;border-radius:20px;font-size:15px;font-weight:500;letter-spacing:.04em;color:#0a0a0c;
  background:linear-gradient(180deg,#fff,#e6e8ee 55%,#b9bdc8);border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 26px rgba(255,255,255,.08),inset 0 1px 0 #fff;transition:transform .15s}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);opacity:.7;animation:sheen 6s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,55%{transform:translate3d(0,0,0) skewX(-20deg)}100%{transform:translate3d(520%,0,0) skewX(-20deg)}}
.btn:active{transform:scale(.975)}
.btn:focus-visible,.tile:focus-visible,.ib:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sub{color:var(--ink2);font-size:14px;margin:8px 0 0;line-height:1.55}
h1,h2,h3{margin:0}
.ttl{font-size:30px;line-height:1.18}

/* splash */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;text-align:center}
.emblem{width:132px;height:132px;position:relative;margin-top:auto}
.emblem::before{content:"";position:absolute;inset:-32%;background:radial-gradient(circle,rgba(255,255,255,.13),transparent 62%)}
.emblem svg{position:relative;width:100%;height:100%;overflow:visible}
.emblem .orbit{transform-origin:60px 60px;animation:spin 42s linear infinite}
.emblem .tw{animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35;transform:scale(.7)}}
@keyframes spin{to{transform:rotate(360deg)}}
.splash h1{font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:.1em;padding-left:.1em;margin-top:24px}
.splash .tag{margin:12px 0 0;font-size:11px;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;color:var(--ink2)}
.splash .count{margin:18px 0 0;font-size:13px;color:var(--ink3)}
.splash .btn{margin-top:auto;margin-bottom:4px}

/* home */
.hello{font-size:36px;line-height:1.16}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.tile{position:relative;border-radius:26px;padding:20px 16px 18px;text-align:left;display:flex;flex-direction:column;gap:14px;min-height:168px;transition:transform .15s,border-color .2s}
.tile:active{transform:scale(.97)}
.tile .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03));border:1px solid var(--line)}
.tile b{font-family:var(--serif);font-weight:400;font-size:17px;line-height:1.25;color:var(--ink)}
.tile span{font-size:12px;color:var(--ink3);line-height:1.4;display:block;margin-top:4px}
.tile .go{position:absolute;right:14px;bottom:14px;color:var(--ink3)}
.note{font-size:12px;color:var(--ink3);margin-top:22px;text-align:center;line-height:1.7}

/* about */
.about-mark{color:var(--ink2);margin-top:18px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.row{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:20px;text-align:left;width:100%}
.row .ico{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.02));border:1px solid var(--line)}
.row b{display:block;font-weight:400;font-size:15px}
.row small{display:block;color:var(--ink3);font-size:12px;margin-top:2px}
.step{display:flex;gap:16px;align-items:flex-start;padding:12px 0}
.step i{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--ink2);background:var(--glass)}
.step b{display:block;font-weight:400;font-size:15px}
.step small{color:var(--ink3);font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app"><div id="head"></div><main id="screen"></main></div>

<script>
const $ = s => document.querySelector(s);
const sv = (p, s=22, f='none') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f}" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ic = {
  back: sv('<path d="M15 5l-7 7 7 7"/>'),
  info: sv('<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8v.01"/>', 20),
  chev: sv('<path d="M9 5l7 7-7 7"/>', 18),
  arrow: sv('<path d="M5 12h14M13 6l6 6-6 6"/>', 18),
  offline: sv('<path d="M3 3l18 18"/><path d="M8.5 16.5a5 5 0 017 0M5 12.6a10 10 0 013-2M12 20v.01M19 12.6a10 10 0 00-6.5-3.5"/>', 20),
  lock: sv('<rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/>', 20),
  heart: sv('<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/>', 20)
};
/* one small glyph per app, all drawn in the same silver-line style */
const APP_ICONS = {
  truthdare: `<svg width="26" height="26" viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="9" cy="10" r="8"/><circle cx="17" cy="10" r="8"/><path d="M13 6.4c.35 2.5 1.55 3.7 4 4-2.45.3-3.65 1.5-4 4-.35-2.5-1.55-3.7-4-4 2.45-.3 3.65-1.5 4-4z" fill="currentColor" stroke="none"/></svg>`,
  memoryjar: `<svg width="24" height="26" viewBox="0 0 26 30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="8" height="4" rx="1.2"/><path d="M8 6.5v1.6C4.7 9.4 3 11.4 3 14v9.5A4.5 4.5 0 007.5 28h11a4.5 4.5 0 004.5-4.5V14c0-2.6-1.7-4.6-5-5.9V6.5"/><path d="M13 20c-3-2-4.5-3.6-4.5-5.6a2.5 2.5 0 014.5-1.5 2.5 2.5 0 014.5 1.5c0 2-1.5 3.6-4.5 5.6z"/></svg>`,
  knowme: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5S3.5 15.4 3.5 9.3a5 5 0 019-3 5 5 0 019 3c0 6.1-8.5 11.2-8.5 11.2z"/><path d="M9.6 8.6c0-1.5 1-2.4 2.2-2.4s2.2.9 2.2 2c0 1.35-1.6 1.7-1.9 2.9M12 15v.01" stroke-width="1.3"/></svg>`,
  notes: `<svg width="24" height="26" viewBox="0 0 24 27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.5 2.5h13.4L21.5 8.6v16H2.5z"/><path d="M15.9 2.5v6.1H21.5"/><path d="M6.5 13.5h11M6.5 17.5h11M6.5 21.5h7" stroke-width="1.3" stroke-linecap="round"/></svg>`
};
const APPS = [
  {slug:'truth-dare', name:'Truth × Dare', tag:'One phone, one game, one turn at a time.', icon:APP_ICONS.truthdare},
  {slug:'memory-jar', name:'Memory Jar', tag:'Little moments, kept safe and private.', icon:APP_ICONS.memoryjar},
  {slug:'know-me', name:'How Well Do You Know Me?', tag:'A calm guessing game for two.', icon:APP_ICONS.knowme},
  {slug:'notes', name:'Notes', tag:'Colourful paper notes and checklists.', icon:APP_ICONS.notes}
];

let startedKey = 'twofold-started';
let alreadyStarted = false;
try{ alreadyStarted = sessionStorage.getItem(startedKey) === '1'; }catch(e){}
const ui = {screen: alreadyStarted ? 'home' : 'splash'};
function bar({back, title}){
  const l = back ? `<button class="ib" data-act="go" data-v="${back}" aria-label="Back">${ic.back}</button>` : '<span></span>';
  return `<div class="bar"><div>${l}</div><div class="bt">${title || ''}</div><div class="r"></div></div>`;
}
const SC = {
splash(){
  return {head:'', body:`
  <div class="splash" data-act="start">
    <div class="emblem"><svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#7d818d"/></linearGradient>
      <clipPath id="ec"><circle cx="46" cy="60" r="27"/></clipPath></defs>
      <circle class="orbit" cx="60" cy="60" r="58" stroke="rgba(255,255,255,.26)" stroke-width=".8" stroke-dasharray="1.5 6" stroke-linecap="round"/>
      <circle cx="74" cy="60" r="27" fill="rgba(255,255,255,.1)" clip-path="url(#ec)"/>
      <circle cx="46" cy="60" r="27" stroke="url(#eg)" stroke-width="1.5"/>
      <circle cx="74" cy="60" r="27" stroke="url(#eg)" stroke-width="1.5"/>
      <path class="tw" d="M60 49c.6 6 3.3 8.7 9 9.3-5.7.6-8.4 3.3-9 9.3-.6-6-3.3-8.7-9-9.3 5.7-.6 8.4-3.3 9-9.3z" fill="#fff"/>
    </svg></div>
    <h1 class="metal">TWOFOLD</h1>
    <p class="tag">Four little apps. One home.</p>
    <p class="count">${APPS.length} apps · works offline</p>
    <button class="btn">Tap to start ${ic.arrow}</button>
  </div>`};
},
home(){
  return {head: bar({}), body:`
  <div style="margin-top:8px"><h1 class="serif hello metal">TwoFold</h1><p class="sub" style="font-size:15px">Pick something to open.</p></div>
  <div class="grid2">${APPS.map(a => `<button class="tile glass" data-act="open" data-v="${a.slug}"><span class="ic">${a.icon}</span><span><b>${a.name}</b><span>${a.tag}</span></span><span class="go">${ic.chev}</span></button>`).join('')}</div>
  <p class="note">Each app keeps its own data on this device.<br>Look for the small grid icon inside an app to come back here.</p>
  <div class="spacer"></div>
  <button class="row glass" data-act="go" data-v="about" style="margin-top:4px"><span class="ico">${ic.info}</span><span style="flex:1"><b>About TwoFold</b><small>Privacy, offline use &amp; credits</small></span><span class="go" style="position:static">${ic.chev}</span></button>`};
},
about(){
  const row = (i, t, s) => `<div class="row glass"><span class="ico">${i}</span><span style="flex:1"><b>${t}</b><small>${s}</small></span></div>`;
  return {head: bar({back:'home', title:'About'}), body:`
  <div class="center about-mark">${ic.heart}<h1 class="serif ttl" style="color:var(--ink);margin-top:16px">Small apps.<br>Built together.</h1></div>
  <div class="list" style="margin-top:28px">
    ${row(ic.offline, 'Works offline', 'Every app runs with no connection once opened')}
    ${row(ic.lock, 'Private by design', 'Nothing leaves this device. There is no account and no server.')}
  </div>
  <p class="sub" style="margin-top:26px">Each app in TwoFold was made one conversation at a time — a game, a jar of memories, a way to ask "how well do you know me", and a place for small notes.</p>
  <div class="spacer"></div>
  <p class="note" style="margin-bottom:4px">TwoFold · a small collection for two people</p>`};
}
};
function render(anim=true){
  const r = SC[ui.screen]();
  $('#head').innerHTML = r.head || '';
  const b = $('#screen'); b.innerHTML = r.body;
  if (anim){ b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter'); b.scrollTop = 0; }
}
const act = {
  start(){ ui.screen = 'home'; try{ sessionStorage.setItem(startedKey, '1'); }catch(e){} render(); },
  go(t){ ui.screen = t.dataset.v; render(); },
  open(t){ location.href = `apps/${t.dataset.v}/index.html`; }
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t && act[t.dataset.act]) act[t.dataset.act](t); });

/* ================= OFFLINE (service worker) ================= */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}

render();
</script>
</body>
</html>
