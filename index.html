<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#040405">
<meta name="description" content="TwoFold - four small private apps for two people. Works offline.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TwoFold">
<title>TwoFold</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --ink:#f6f6f8; --ink2:rgba(246,246,248,.66); --ink3:rgba(246,246,248,.4);
  --line:rgba(255,255,255,.12); --glass:rgba(255,255,255,.07);
  --metal:linear-gradient(180deg,#ffffff 0%,#dcdfe6 40%,#8e929e 100%);
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#040405;color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
.serif{font-family:var(--serif);font-weight:400}
.metal{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

#shell{position:fixed;inset:0;display:flex;flex-direction:column;max-width:430px;margin:0 auto;background:#040405}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
.pane{position:absolute;inset:0;display:none}
.pane.on{display:block}
.pane iframe{width:100%;height:100%;border:0;display:block;background:#040405}

/* shell background (Home pane sits on top of this) */
#bg{position:absolute;inset:0;z-index:0;contain:strict}
.s-ocean{background:radial-gradient(120% 90% at 50% 50%,rgba(150,175,205,.22),transparent 68%),radial-gradient(70% 20% at 50% 55%,rgba(255,255,255,.3),transparent 72%),linear-gradient(180deg,#040405 0%,#0d0e11 40%,#4a4f58 56%,#0a0b0d 60%,#030304 100%)}
.s-rain{background:radial-gradient(120% 90% at 50% 45%,rgba(130,165,210,.24),transparent 70%),radial-gradient(circle at 18% 28%,rgba(255,255,255,.32) 0 5%,transparent 9%),radial-gradient(circle at 70% 20%,rgba(255,255,255,.28) 0 7%,transparent 11%),radial-gradient(circle at 82% 62%,rgba(255,255,255,.22) 0 6%,transparent 10%),radial-gradient(circle at 34% 74%,rgba(255,255,255,.26) 0 8%,transparent 12%),radial-gradient(circle at 52% 44%,rgba(255,255,255,.18) 0 4%,transparent 8%),radial-gradient(circle at 12% 60%,rgba(150,180,220,.14) 0 5%,transparent 9%),linear-gradient(180deg,#0a0d12,#1c212b 60%,#070a0d)}
.s-night{background:radial-gradient(130% 100% at 50% 45%,rgba(110,90,190,.32),transparent 68%),radial-gradient(2px 2px at 20% 60%,#fff,transparent),radial-gradient(1.6px 1.6px at 35% 75%,#fff,transparent),radial-gradient(2.3px 2.3px at 55% 65%,#fff,transparent),radial-gradient(1.6px 1.6px at 70% 80%,#fff,transparent),radial-gradient(2px 2px at 85% 58%,#fff,transparent),radial-gradient(1.8px 1.8px at 14% 22%,#fff,transparent),radial-gradient(1.3px 1.3px at 28% 12%,#fff,transparent),radial-gradient(2.1px 2.1px at 44% 30%,#fff,transparent),radial-gradient(1.4px 1.4px at 61% 16%,#fff,transparent),radial-gradient(1.9px 1.9px at 76% 34%,#fff,transparent),radial-gradient(1.4px 1.4px at 88% 10%,#fff,transparent),radial-gradient(1.7px 1.7px at 22% 48%,#fff,transparent),radial-gradient(1.4px 1.4px at 68% 52%,#fff,transparent),radial-gradient(1.7px 1.7px at 90% 42%,#fff,transparent),radial-gradient(1.4px 1.4px at 8% 40%,#fff,transparent),linear-gradient(180deg,#08071a,#1c1740 55%,#332654 100%)}
.s-forest{background:radial-gradient(130% 100% at 50% 50%,rgba(150,205,180,.2),transparent 68%),radial-gradient(55% 34% at 26% 68%,rgba(255,255,255,.22),transparent 70%),radial-gradient(60% 30% at 78% 38%,rgba(255,255,255,.14),transparent 70%),linear-gradient(180deg,#050807,#132018 50%,#0a1310 100%)}
.s-sunset{background:radial-gradient(130% 100% at 50% 50%,rgba(220,140,155,.22),transparent 68%),radial-gradient(circle at 72% 30%,rgba(255,255,255,.98) 0 3.2%,rgba(255,255,255,.4) 4.6%,rgba(255,255,255,.12) 8%,transparent 32%),linear-gradient(180deg,#0a0710,#241a28 50%,#341f2b 100%)}
.s-black{background:radial-gradient(60% 30% at 50% 40%,rgba(255,255,255,.06),transparent 72%),linear-gradient(180deg,#030304,#0a0a0d)}

/* splash (shown once, on top of everything) */
#splash{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#splash.hide{display:none}
.spacer{flex:1;min-height:14px}
.emblem{width:132px;height:132px;position:relative}
.emblem::before{content:"";position:absolute;inset:-32%;background:radial-gradient(circle,rgba(255,255,255,.13),transparent 62%)}
.emblem svg{position:relative;width:100%;height:100%;overflow:visible}
.emblem .orbit{transform-origin:60px 60px;animation:spin 42s linear infinite}
.emblem .tw{animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35;transform:scale(.7)}}
@keyframes spin{to{transform:rotate(360deg)}}
#splash h1{font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:.1em;padding-left:.1em;margin-top:24px}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;flex:none;border-radius:20px;font-size:15px;font-weight:500;letter-spacing:.04em;color:#0a0a0c;
  background:linear-gradient(180deg,#fff,#e6e8ee 55%,#b9bdc8);border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 26px rgba(255,255,255,.08),inset 0 1px 0 #fff;transition:transform .15s}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);opacity:.7;animation:sheen 6s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,55%{transform:translate3d(0,0,0) skewX(-20deg)}100%{transform:translate3d(520%,0,0) skewX(-20deg)}}
.btn:active{transform:scale(.975)}
#splash .btnwrap{width:100%;padding:0 24px calc(18px + env(safe-area-inset-bottom,0px))}

/* home + settings panes (inside the shell, not iframes) */
.hbar{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 4px;position:relative;z-index:1}
.hbar .t{text-align:center;font-family:var(--serif);font-size:18px;color:var(--ink)}
.hbar .r{display:flex;justify-content:flex-end}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:background .2s,color .2s}
.ib:active{background:var(--glass);color:#fff}
.hscroll{position:relative;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 22px 24px;scrollbar-width:none;z-index:1}
.hscroll::-webkit-scrollbar{display:none}
.hpane{position:absolute;inset:0;display:flex;flex-direction:column}
.hello{font-size:34px;line-height:1.16;margin-top:6px;opacity:0;animation:hin .5s .05s cubic-bezier(.2,.7,.2,1) both}
.sub{color:var(--ink2);font-size:14px;margin:8px 0 0;line-height:1.55;opacity:0;animation:hin .5s .12s cubic-bezier(.2,.7,.2,1) both}
@keyframes hin{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.hemblem{width:60px;height:60px;margin-top:4px;opacity:0;animation:hin .5s cubic-bezier(.2,.7,.2,1) both}
.hemblem svg{width:100%;height:100%;overflow:visible}
.horbit{transform-origin:30px 30px;animation:spin 34s linear infinite}
.htw{animation:twinkle 3.2s ease-in-out infinite}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.tile{position:relative;border-radius:26px;padding:20px 16px 18px;text-align:left;display:flex;flex-direction:column;gap:14px;min-height:150px;transition:transform .15s;
  background:linear-gradient(180deg,rgba(20,20,24,.62),rgba(10,10,12,.72));backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);
  opacity:0;animation:tilein .5s cubic-bezier(.2,.75,.2,1) both}
@keyframes tilein{from{opacity:0;transform:translate3d(0,16px,0) scale(.96)}to{opacity:1;transform:none}}
.tile:active{transform:scale(.97)}
.tile .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03));border:1px solid var(--line);color:#fff;position:relative;overflow:hidden}
.tile .ic::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:tsheen 5s ease-in-out infinite}
.tile:nth-child(2) .ic::after{animation-delay:.4s}
.tile:nth-child(3) .ic::after{animation-delay:.8s}
.tile:nth-child(4) .ic::after{animation-delay:1.2s}
@keyframes tsheen{0%,60%{transform:translate3d(0,0,0) skewX(-20deg)}100%{transform:translate3d(340%,0,0) skewX(-20deg)}}
.tile b{font-family:var(--serif);font-weight:400;font-size:16px;line-height:1.25;color:var(--ink)}
.tile span{font-size:11.5px;color:var(--ink3);line-height:1.4;display:block;margin-top:4px}
.note{font-size:12px;color:var(--ink3);margin-top:22px;text-align:center;line-height:1.7}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.row{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:20px;text-align:left;width:100%;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line)}
.row .ico{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.02));border:1px solid var(--line)}
.row b{display:block;font-weight:400;font-size:15px}
.row small{display:block;color:var(--ink3);font-size:12px;margin-top:2px}
.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:24px 4px 10px}
.bgs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tileb{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:1px solid var(--line);transition:border-color .2s,transform .2s}
.tileb .sw{position:absolute;inset:0}
.tileb span{position:absolute;left:0;right:0;bottom:0;padding:16px 5px 7px;font-size:10px;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
.tileb.on{border:2px solid #fff;transform:scale(1.02)}
.swtoggle{width:46px;height:28px;border-radius:20px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .25s}
.swtoggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#9a9ea9;transition:transform .25s,background .25s}
.swtoggle.on{background:rgba(255,255,255,.35)} .swtoggle.on::after{transform:translateX(18px);background:#fff}
.chev{color:var(--ink3);flex:none}

/* persistent bottom tab bar */
#tabs{flex:none;display:flex;padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px));gap:4px;
  background:rgba(10,10,12,.92);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.4)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px 6px;border-radius:16px;color:var(--ink3);transition:color .2s,background .2s}
#tabs button.on{color:#fff;background:rgba(255,255,255,.08)}
#tabs button span{font-size:10px;letter-spacing:.01em}
#tabs svg{display:block}

/* lock screen */
#lockscreen{position:fixed;inset:0;z-index:60;background:#000;display:none;flex-direction:column;align-items:center;text-align:center;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#lockscreen.show{display:flex}
.lockw{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;padding:0 24px}
.lockw .li{color:var(--ink2);margin-top:auto}
.dots{display:flex;gap:16px;margin:26px 0 30px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);transition:background .15s,transform .15s}
.dots i.on{background:#fff;border-color:#fff;transform:scale(1.1)}
.dots.bad{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;justify-content:center;margin-bottom:auto}
.key{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:30px;background:var(--glass);border:1px solid var(--line);transition:transform .12s,background .2s;color:var(--ink)}
.key:active{transform:scale(.92);background:rgba(255,255,255,.18)}
.key.ghost{background:none;border-color:transparent;font-size:14px;color:var(--ink2)}
.key.none{visibility:hidden}
.lk{color:var(--ink2);font-size:13px;padding:14px}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="lockscreen"></div>
<div id="shell">
  <div id="stage">
    <div class="pane on" data-pane="home">
      <div id="bg" class="s-ocean"></div>
      <div class="hpane">
        <div class="hbar"><div></div><div class="t"></div><div class="r"><button class="ib" id="gearBtn" aria-label="Settings"></button></div></div>
        <div class="hscroll" id="homeScroll"></div>
      </div>
    </div>
    <div class="pane" data-pane="truth-dare"><iframe title="Truth × Dare" loading="eager"></iframe></div>
    <div class="pane" data-pane="memory-jar"><iframe title="Memory Jar" loading="eager"></iframe></div>
    <div class="pane" data-pane="know-me"><iframe title="How Well Do You Know Me?" loading="eager"></iframe></div>
    <div class="pane" data-pane="notes"><iframe title="Notes" loading="eager"></iframe></div>
  </div>
  <nav id="tabs"></nav>
</div>

<div id="splash">
  <div class="spacer"></div>
  <div class="emblem"><svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
    <defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#7d818d"/></linearGradient>
    <clipPath id="ec"><circle cx="46" cy="60" r="27"/></clipPath></defs>
    <circle class="orbit" cx="60" cy="60" r="58" stroke="rgba(255,255,255,.26)" stroke-width=".8" stroke-dasharray="1.5 6" stroke-linecap="round"/>
    <circle cx="74" cy="60" r="27" fill="rgba(255,255,255,.1)" clip-path="url(#ec)"/>
    <circle cx="46" cy="60" r="27" stroke="url(#eg)" stroke-width="1.5"/>
    <circle cx="74" cy="60" r="27" stroke="url(#eg)" stroke-width="1.5"/>
    <path class="tw" d="M60 49c.6 6 3.3 8.7 9 9.3-5.7.6-8.4 3.3-9 9.3-.6-6-3.3-8.7-9-9.3 5.7-.6 8.4-3.3 9-9.3z" fill="#fff"/>
  </svg></div>
  <h1 class="metal">TWOFOLD</h1>
  <div class="spacer"></div>
  <div class="btnwrap"><button class="btn" id="startBtn">Tap to start</button></div>
</div>

<script>
const $ = s => document.querySelector(s);
const sv = (p, s=22, f='none', sw=1.5) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f}" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICONS = {
  home:  sv('<path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5h12V10"/>', 21),
  truthdare: sv('<circle cx="9" cy="10" r="7.2"/><circle cx="15" cy="10" r="7.2"/><path d="M12 5.8c.3 2.3 1.4 3.4 3.6 3.7-2.2.3-3.3 1.4-3.6 3.7-.3-2.3-1.4-3.4-3.6-3.7 2.2-.3 3.3-1.4 3.6-3.7z" fill="currentColor" stroke="none"/>', 21, 'none', 1.4),
  memoryjar: sv('<rect x="9" y="2.2" width="6" height="3" rx="1"/><path d="M7.3 5.2v1.2C4.6 7.6 3.3 9.2 3.3 11.3v6.9A3.8 3.8 0 007.1 22h9.8a3.8 3.8 0 003.8-3.8v-6.9c0-2.1-1.3-3.7-4-4.9V5.2"/><path d="M12 15.5c-2.3-1.6-3.4-2.8-3.4-4.3a2 2 0 013.4-1.2A2 2 0 0115.4 11c0 1.5-1.1 2.7-3.4 4.5z"/>', 21, 'none', 1.4),
  knowme: sv('<path d="M12 19.5S4.8 15 4.8 9.6a4.3 4.3 0 017.7-2.6 4.3 4.3 0 017.7 2.6c0 5.4-7.7 9.9-7.7 9.9z"/><path d="M9.9 8.2c0-1.25.85-2 1.9-2s1.9.75 1.9 1.7c0 1.15-1.35 1.45-1.6 2.5M12 14v.01" stroke-width="1.25"/>', 21, 'none', 1.4),
  notes: sv('<path d="M4 2.5h11.6L20 6.9V21.5H4z"/><path d="M15.6 2.5v4.4H20"/><path d="M7.5 12h9M7.5 15.5h9M7.5 19h6" stroke-width="1.2"/>', 21, 'none', 1.4),
  gear: sv('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>', 19),
  back: sv('<path d="M15 5l-7 7 7 7"/>', 21),
  offline: sv('<path d="M3 3l18 18"/><path d="M8.5 16.5a5 5 0 017 0M5 12.6a10 10 0 013-2M12 20v.01M19 12.6a10 10 0 00-6.5-3.5"/>', 20),
  lock: sv('<rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/>', 20)
};
const APPS = [
  {slug:'truth-dare', name:'Truth × Dare', tag:'One phone, one game, one turn at a time.', icon:ICONS.truthdare, tab:'Play'},
  {slug:'memory-jar', name:'Memory Jar', tag:'Little moments, kept safe and private.', icon:ICONS.memoryjar, tab:'Jar'},
  {slug:'know-me', name:'How Well Do You Know Me?', tag:'A calm guessing game for two.', icon:ICONS.knowme, tab:'Know Me'},
  {slug:'notes', name:'Notes', tag:'Colourful paper notes and checklists.', icon:ICONS.notes, tab:'Notes'}
];
const TABS = [{slug:'home', name:'Home', icon:ICONS.home}, ...APPS.map(a => ({slug:a.slug, name:a.tab, icon:a.icon}))];
const BGS = [['ocean','Obsidian Shore'],['rain','Rainy Window'],['night','Night Sky'],['forest','Smoke'],['sunset','Moonlight'],['black','Minimal Black']];

/* ---- shell-level settings (background choice + app lock), separate from every app's own settings ---- */
const SKEY = 'twofold-shell-v1';
let SHELL = {bg:'ocean', lock:{on:false, salt:'', hash:''}};
try{ const r = JSON.parse(localStorage.getItem(SKEY)); if (r) SHELL = {...SHELL, ...r, lock:{...SHELL.lock, ...(r.lock||{})}}; }catch(e){}
function saveShell(){ try{ localStorage.setItem(SKEY, JSON.stringify(SHELL)); }catch(e){} }
$('#bg').className = 's-' + SHELL.bg;

/* ---- persistent tab bar ---- */
$('#tabs').innerHTML = TABS.map(t => `<button data-tab="${t.slug}" class="${t.slug==='home'?'on':''}">${t.icon}<span>${t.name}</span></button>`).join('');

/* ---- home / settings mini-router (lives only inside the Home pane) ---- */
let homeScreen = 'grid';
function homeGridHTML(){
  return `
  <div class="hemblem"><svg viewBox="0 0 60 60" fill="none" aria-hidden="true">
    <defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#7d818d"/></linearGradient></defs>
    <circle class="horbit" cx="30" cy="30" r="28" stroke="rgba(255,255,255,.22)" stroke-width=".7" stroke-dasharray="1.2 5" stroke-linecap="round"/>
    <circle cx="24" cy="30" r="13" stroke="url(#hg)" stroke-width="1.2"/>
    <circle cx="36" cy="30" r="13" stroke="url(#hg)" stroke-width="1.2"/>
    <path class="htw" d="M30 24.5c.3 2.9 1.6 4.2 4.4 4.5-2.8.3-4.1 1.6-4.4 4.5-.3-2.9-1.6-4.2-4.4-4.5 2.8-.3 4.1-1.6 4.4-4.5z" fill="#fff"/>
  </svg></div>
  <h1 class="serif hello metal">TwoFold</h1>
  <p class="sub">Four small apps, made for two people.</p>
  <div class="grid2">${APPS.map((a,i) => `<button class="tile" data-open="${a.slug}" style="animation-delay:${i*70}ms"><span class="ic">${a.icon}</span><span><b>${a.name}</b><span>${a.tag}</span></span></button>`).join('')}</div>`;
}
function homeSettingsHTML(){
  const row = (i, t, s) => `<div class="row"><span class="ico">${i}</span><span style="flex:1"><b>${t}</b><small>${s}</small></span></div>`;
  const on = SHELL.lock.on;
  return `
  <p class="lbl" style="margin-top:4px">App Lock</p>
  <div class="list">
    <button class="row" data-act="toggleLock"><span class="ico">${ICONS.lock}</span><span style="flex:1"><b>Lock TwoFold</b><small>${on ? 'On · asks for your PIN when you return' : 'Ask for a PIN when opening or returning'}</small></span><span class="swtoggle ${on?'on':''}"></span></button>
    ${on ? `<button class="row" data-act="changePin"><span class="ico">${ICONS.lock}</span><span style="flex:1"><b>Change PIN</b></span><span class="chev">${sv('<path d="M9 5l7 7-7 7"/>',18)}</span></button>` : ''}
  </div>
  <p class="note" style="margin-top:10px;text-align:left">Locks the whole of TwoFold, including all four apps. Each app's own data stays exactly as private as before either way.</p>
  <p class="lbl">Background</p>
  <div class="bgs">${BGS.map(([k,l]) => `<button class="tileb ${SHELL.bg===k?'on':''}" data-bg="${k}" aria-label="${l}"><span class="sw s-${k}"></span><span>${l}</span></button>`).join('')}</div>
  <p class="note" style="margin-top:14px;text-align:left">This sets the look of the Home screen only. Each app has its own separate background option inside its own settings.</p>
  <p class="lbl">About TwoFold</p>
  <div class="list">
    ${row(ICONS.offline, 'Works offline', 'Every app runs with no connection once opened')}
    ${row(ICONS.lock, 'Private by design', 'Nothing leaves this device. There is no account and no server.')}
  </div>
  <p class="note">TwoFold · a small collection for two people</p>`;
}
function renderHome(){
  $('.hbar .t').textContent = homeScreen === 'settings' ? 'Settings' : '';
  $('.hbar').firstElementChild.innerHTML = homeScreen === 'settings' ? `<button class="ib" id="homeBack" aria-label="Back">${ICONS.back}</button>` : '';
  $('#gearBtn').style.visibility = homeScreen === 'settings' ? 'hidden' : 'visible';
  $('#gearBtn').innerHTML = ICONS.gear;
  $('#homeScroll').innerHTML = homeScreen === 'settings' ? homeSettingsHTML() : homeGridHTML();
  $('#homeScroll').scrollTop = 0;
  const back = $('#homeBack'); if (back) back.addEventListener('click', () => { homeScreen = 'grid'; renderHome(); });
}
$('#gearBtn').addEventListener('click', () => { homeScreen = 'settings'; renderHome(); });
$('#homeScroll').addEventListener('click', e => {
  const open = e.target.closest('[data-open]'); if (open){ showTab(open.dataset.open); return; }
  const bgBtn = e.target.closest('[data-bg]');
  if (bgBtn){ SHELL.bg = bgBtn.dataset.bg; saveShell(); $('#bg').className = 's-' + SHELL.bg; renderHome(); return; }
  const act = e.target.closest('[data-act]');
  if (act && act.dataset.act === 'toggleLock'){ SHELL.lock.on ? openLock('verify', 'off') : openLock('new1'); return; }
  if (act && act.dataset.act === 'changePin'){ openLock('verify', 'change'); return; }
});
renderHome();

/* ---- pane / iframe management ---- */
const loaded = {home:true};
function srcFor(slug){ return `apps/${slug}/index.html`; }
function showTab(slug){
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.dataset.pane === slug));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === slug));
  if (slug !== 'home' && !loaded[slug]){
    const pane = document.querySelector(`.pane[data-pane="${slug}"] iframe`);
    pane.src = srcFor(slug);
    loaded[slug] = true;
  }
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  showTab(b.dataset.tab);
});

/* ---- splash ---- */
$('#startBtn').addEventListener('click', () => { $('#splash').classList.add('hide'); });

/* ================= APP LOCK (protects the whole shell) ================= */
let pin = {mode:'unlock', buf:'', first:'', then:''};
let hiddenAt = 0;
async function hashPin(p, salt){
  try{ const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + p)); return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch(e){ let h = 5381; for (const c of salt + ':' + p) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'x' + h; }
}
function renderLock(){
  const titles = {unlock:'Enter your PIN', new1:'Create a PIN', new2:'Confirm your PIN', verify:'Enter current PIN'};
  const subs = {unlock:'TwoFold is locked.', new1:'Choose 4 digits.', new2:'Enter the same 4 digits again.', verify:'Enter your PIN to continue.'};
  const key = v => `<button class="key" data-key="${v}">${v}</button>`;
  $('#lockscreen').innerHTML = `
    <div class="lockw"><div class="spacer"></div><div class="li">${ICONS.lock}</div>
      <h1 class="serif" style="font-size:26px;margin-top:16px">${titles[pin.mode]}</h1><p class="sub">${subs[pin.mode]}</p>
      <div class="dots" id="dots">${[0,1,2,3].map(i => `<i class="${i < pin.buf.length ? 'on' : ''}"></i>`).join('')}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(key).join('')}<span class="key none"></span>${key(0)}<button class="key ghost" data-key="del" aria-label="Delete digit">${sv('<path d="M9 6h10a2 2 0 012 2v8a2 2 0 01-2 2H9l-6-6z"/><path d="M12 10l4 4M16 10l-4 4"/>', 24)}</button></div>
      ${pin.mode === 'unlock' ? `<button class="lk" data-act="forgotPin">Forgot PIN?</button>` : `<button class="lk" data-act="cancelPin">Cancel</button>`}
    </div>`;
}
function openLock(mode, then){ pin = {mode, buf:'', first:'', then: then || ''}; renderLock(); $('#lockscreen').classList.add('show'); }
function closeLock(){ $('#lockscreen').classList.remove('show'); }
async function pinDone(){
  const val = pin.buf;
  if (pin.mode === 'unlock' || pin.mode === 'verify'){
    const ok = (await hashPin(val, SHELL.lock.salt)) === SHELL.lock.hash;
    if (!ok){
      const d = $('#dots'); if (d) d.classList.add('bad');
      setTimeout(() => { pin.buf = ''; renderLock(); }, 420);
      return;
    }
    if (pin.mode === 'unlock'){ closeLock(); return; }
    if (pin.then === 'off'){ SHELL.lock = {on:false, salt:'', hash:''}; saveShell(); closeLock(); renderHome(); return; }
    if (pin.then === 'change'){ openLock('new1'); return; }
  } else if (pin.mode === 'new1'){
    pin = {mode:'new2', buf:'', first:val, then:''}; renderLock();
  } else if (pin.mode === 'new2'){
    if (val !== pin.first){ openLock('new1'); return; }
    const salt = Math.random().toString(36).slice(2);
    SHELL.lock = {on:true, salt, hash: await hashPin(val, salt)}; saveShell();
    closeLock(); renderHome();
  }
}
$('#lockscreen').addEventListener('click', e => {
  const k = e.target.closest('[data-key]');
  if (k){
    const v = k.dataset.key;
    if (v === 'del') pin.buf = pin.buf.slice(0, -1); else if (pin.buf.length < 4) pin.buf += v;
    document.querySelectorAll('#dots i').forEach((el, i) => el.classList.toggle('on', i < pin.buf.length));
    if (pin.buf.length === 4) setTimeout(pinDone, 140);
    return;
  }
  const act = e.target.closest('[data-act]'); if (!act) return;
  if (act.dataset.act === 'cancelPin') closeLock();
  if (act.dataset.act === 'forgotPin'){
    if (confirm("Forgetting your PIN will turn App Lock off. Your apps and their data stay exactly as they are. Continue?")){
      SHELL.lock = {on:false, salt:'', hash:''}; saveShell(); closeLock(); renderHome();
    }
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ hiddenAt = Date.now(); return; }
  if (SHELL.lock.on && !$('#lockscreen').classList.contains('show') && Date.now() - hiddenAt > 15000) openLock('unlock');
});
if (SHELL.lock.on) openLock('unlock');

/* ================= OFFLINE (service worker) ================= */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
