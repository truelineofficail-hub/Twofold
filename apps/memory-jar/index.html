<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050506">
<title>Memory Jar</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --ink:#f6f6f8; --ink2:rgba(246,246,248,.66); --ink3:rgba(246,246,248,.4);
  --line:rgba(255,255,255,.12); --glass:rgba(255,255,255,.055);
  --warm:#e9b98f;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:#050506;color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input,textarea{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
.serif{font-family:var(--serif);font-weight:400}

#app{position:relative;max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(90% 40% at 50% 0%,rgba(255,255,255,.05),transparent 70%),#050506;overflow:hidden}
#head,#body,#foot{position:relative;z-index:1}
#app[data-s="home"]{background:#000}
.metal{background:linear-gradient(180deg,#fff 0%,#dcdfe6 45%,#8e929e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.homej{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.homej .jar{width:min(80%,310px)}
.homej h1.homet{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:.24em;padding-left:.24em;margin-top:18px;text-align:center;width:100%}
.jar.flt{animation:flt 7s ease-in-out infinite}
@keyframes flt{50%{transform:translate3d(0,-8px,0)}}

/* header */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 12px 6px;min-height:58px}
.bar .c{display:flex;justify-content:center}
.bar>div:first-child{display:flex;justify-content:flex-start}
.bar .r{display:flex;justify-content:flex-end}
.brand{font-family:var(--serif);font-size:19px;letter-spacing:.01em;color:var(--ink)}
.bar.home{grid-template-columns:1fr 52px;padding-left:22px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:background .2s,color .2s}
.ib:active,.ib:focus-visible{background:var(--glass);color:#fff;outline:none}

#body{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 24px 24px;display:flex;flex-direction:column;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#body::-webkit-scrollbar{display:none}
#body.enter>*{animation:in .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
#foot{flex:none;padding:10px 24px 18px}
.spacer{flex:1;min-height:14px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:28px;font-size:15px;font-weight:500;letter-spacing:.02em;color:#0a0a0c;
  background:linear-gradient(180deg,#fff,#e4e6ec 60%,#c1c5cf);border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 1px 0 #fff;transition:transform .15s}
.btn:active{transform:scale(.975)}
.btn.dark{color:var(--ink);font-weight:400;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.btn.warm{color:var(--warm);font-weight:400;background:rgba(233,185,143,.06);border-color:rgba(233,185,143,.3);box-shadow:none}
.btn:focus-visible,.row:focus-visible,.chip:focus-visible,.drop:focus-visible{outline:1px solid #fff;outline-offset:2px}
.links{display:flex;justify-content:center;gap:6px;margin-top:6px;font-size:13px;color:var(--ink2)}
.links button{padding:10px 12px;color:var(--ink2)} .links button:active{color:#fff}
.safe{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:var(--ink3);margin:8px 0 0;letter-spacing:.03em}

/* glass */
.glass{background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}

/* home */
.hero{margin-top:auto;margin-bottom:auto;padding-bottom:80px}
.hero .ji{color:#fff;margin-bottom:14px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1.1;letter-spacing:.005em}
.hero .tg{margin:12px 0 0;font-size:15px;color:var(--ink)}
.hero .ds{margin:26px 0 0;font-size:13.5px;line-height:1.75;color:var(--ink2);max-width:270px}

/* titles */
.pt{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.15;margin:6px 0 0}
.ps{color:var(--ink2);font-size:14px;margin:8px 0 0;line-height:1.5}

/* chips */
.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;margin-right:-6px;padding-right:6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:20px;font-size:13px;color:var(--ink2);border:1px solid var(--line);background:var(--glass);transition:all .2s}
.chip.on{color:#0a0a0c;background:linear-gradient(180deg,#fff,#d8dbe2);border-color:#fff;font-weight:500}
.vt{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);border:1px solid var(--line);background:var(--glass)}

/* list */
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.row{position:relative;display:flex;gap:14px;align-items:center;padding:10px;border-radius:18px;text-align:left;width:100%;transition:transform .15s}
.row:active{transform:scale(.985)}
.th{flex:none;width:68px;height:68px;border-radius:12px;overflow:hidden;background:#141518;display:grid;place-items:center;color:var(--ink3)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.rt{flex:1;min-width:0;padding-right:34px}
.rt b{display:block;font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{display:block;font-size:11.5px;color:var(--ink3);margin-top:4px}
.rt em{display:block;font-family:var(--serif);font-size:12.5px;color:var(--ink2);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hv{position:absolute;right:6px;bottom:6px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);transition:color .2s,transform .2s}
.hv.on{color:#fff}
.hv.on svg{fill:currentColor}
.hv:active{transform:scale(.85)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.g{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#131418;border:1px solid var(--line);display:grid;place-items:center;padding:8px;text-align:center}
.g img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.g span{font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.3;color:var(--ink2)}
.g i{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 3px #000)}
.empty{margin:auto 0;padding-bottom:60px}
.empty .ji{color:#fff;margin-bottom:16px}
.empty h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0}
.empty p{color:var(--ink2);font-size:14px;line-height:1.6;margin:10px 0 0;max-width:250px}

/* add */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:190px;margin-top:20px;border-radius:22px;border:1.5px dashed rgba(255,255,255,.22);background:rgba(255,255,255,.025);cursor:pointer;overflow:hidden;color:var(--ink2);text-align:center}
.drop b{font-weight:400;font-size:15px;color:var(--ink)}
.drop small{font-size:12px;color:var(--ink3)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2;font-size:0}
.drop .chg{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;z-index:1}
.rmp{display:block;margin:10px auto 0;font-size:12.5px;color:var(--ink2);padding:8px 14px}
.rmp:active{color:#fff}
.drop .chg span{font-size:12px;padding:7px 12px;border-radius:16px;background:rgba(0,0,0,.6);border:1px solid var(--line);color:#fff}
.fl{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink2);margin:20px 4px 8px;letter-spacing:.02em}
.fl small{color:var(--ink3);font-size:11px}
.in{width:100%;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid var(--line);font-size:15px;outline:0;font-weight:400;transition:border-color .2s}
.in::placeholder{color:var(--ink3);font-weight:300}
.in:focus{border-color:rgba(255,255,255,.5)}
textarea.in{min-height:104px;resize:none;line-height:1.55}
input[type=date].in{color-scheme:dark;appearance:none;-webkit-appearance:none;min-height:50px}

/* detail */
.photo{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#101114;margin-top:8px}
.photo img{display:block;width:100%;max-height:340px;object-fit:cover}
.photo.none{height:150px;display:grid;place-items:center;color:var(--ink3)}
.dh{font-family:var(--serif);font-weight:400;font-size:27px;margin:22px 2px 0;line-height:1.2}
.dm{color:var(--ink2);font-size:13.5px;margin:8px 2px 0}
.quote{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.7;color:var(--ink);margin:26px 8px;text-align:center}
.quote::before{content:"“ "} .quote::after{content:" ”"}
.acts{display:flex;justify-content:space-around;margin:8px 0 18px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.act .c{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--glass);color:var(--ink);transition:transform .15s,background .2s}
.act:active .c{transform:scale(.92)}
.act.on .c{background:#fff;color:#0a0a0c;border-color:#fff}
.act.on .c svg{fill:currentColor}

/* jar */
.jarwrap{display:flex;flex-direction:column;align-items:center;margin-top:0}
.jar{width:min(78%,300px);height:auto;display:block;transform-origin:50% 90%}
.jar.wob{animation:wob .7s ease-in-out}
@keyframes wob{15%{transform:rotate(-4deg)}35%{transform:rotate(3.5deg)}55%{transform:rotate(-2deg)}75%{transform:rotate(1deg)}}
.jar .pol{animation:pop .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:150px 170px}
@keyframes pop{from{opacity:0;transform:translate3d(0,14px,0) scale(.94)}to{opacity:1;transform:none}}
.jar .tw{animation:tw 3.4s ease-in-out infinite}
.jar .tw:nth-of-type(2n){animation-delay:1.1s}.jar .tw:nth-of-type(3n){animation-delay:2s}
@keyframes tw{50%{opacity:.15}}
.jt{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.5;color:var(--ink);margin:6px 0 0;text-align:center}
.mini{display:flex;align-items:center;gap:14px;padding:12px;margin-top:22px;border-radius:18px;width:100%;text-align:left}
.mini .th{width:60px;height:60px}
.mini .rt{padding:0}
.mini em{font-size:12.5px}

/* about */
.al{margin-top:26px;border-top:1px solid var(--line)}
.ar{display:flex;align-items:center;gap:16px;width:100%;padding:18px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14.5px;color:var(--ink)}
.ar svg:first-child{color:var(--ink2)}
.ar span{flex:1}
.ar .ch{color:var(--ink3)}
.ar.warm,.ar.warm svg{color:var(--warm)}

/* sheet + toast */
#sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.7)}
#sheet .box{width:100%;max-width:430px;padding:12px 24px calc(20px + env(safe-area-inset-bottom,0px));background:#111114;border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;animation:up .3s cubic-bezier(.2,.8,.2,1) both;text-align:center}
@keyframes up{from{transform:translate3d(0,40px,0);opacity:0}to{transform:none;opacity:1}}
#sheet .hd{width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);margin:0 auto 20px}
#sheet h3{font-family:var(--serif);font-weight:400;font-size:22px;margin:0}
#sheet p{color:var(--ink2);font-size:13.5px;line-height:1.65;margin:10px 0 20px}
#sheet .stack{display:flex;flex-direction:column;gap:10px}
#sheet .stack .btn{height:52px}
#sheet ol{text-align:left;color:var(--ink2);font-size:14px;line-height:1.7;padding-left:20px;margin:16px 0 22px}
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,10px);z-index:30;padding:11px 18px;border-radius:16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;background:rgba(20,20,24,.97);border:1px solid var(--line);white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

#hubNav{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:14px;z-index:15;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  opacity:.55;transition:opacity .2s,background .2s;touch-action:manipulation}
#hubNav:active{opacity:1;background:rgba(255,255,255,.16)}
@media (min-width:431px){#hubNav{left:calc(50% - 205px + 14px)}}
</style>
</head>
<body>
<button id="hubNav" aria-label="All Apps" title="All Apps"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg></button>
<script>document.getElementById('hubNav').addEventListener('click', function(){ location.href = '../../index.html'; });</script>

<div id="app" data-s="home">
  <div id="head"></div>
  <main id="body"></main>
  <div id="foot"></div>
</div>
<div id="sheet"></div>
<div id="toast" role="status"></div>

<script>
/* ================= STORAGE (IndexedDB, falls back to localStorage) ================= */
let M = [];
const LS = 'twofold-memory-jar';
const DB = {
  db: null,
  open(){ return new Promise(res => { try{
    const r = indexedDB.open('memory-jar', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('m', {keyPath:'id'});
    r.onsuccess = () => { this.db = r.result; res(true); };
    r.onerror = () => res(false); r.onblocked = () => res(false);
  }catch(e){ res(false); } }); },
  all(){ return new Promise(res => {
    if (!this.db){ try{ res(JSON.parse(localStorage.getItem(LS)) || []); }catch(e){ res([]); } return; }
    try{ const q = this.db.transaction('m').objectStore('m').getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }catch(e){ res([]); }
  }); },
  lsSave(){ try{ localStorage.setItem(LS, JSON.stringify(M)); }catch(e){ toast('Storage is full. Try smaller photos.'); } },
  put(m){ if (!this.db) return this.lsSave(); try{ this.db.transaction('m','readwrite').objectStore('m').put(m); }catch(e){ this.lsSave(); } },
  del(id){ if (!this.db) return this.lsSave(); try{ this.db.transaction('m','readwrite').objectStore('m').delete(id); }catch(e){} },
  clear(){ if (!this.db) return this.lsSave(); try{ this.db.transaction('m','readwrite').objectStore('m').clear(); }catch(e){} }
};

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toLocaleDateString('en-CA');
const fmt = d => { try{ const t = new Date(d + 'T12:00:00'); return isNaN(t) ? '' : t.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}); }catch(e){ return ''; } };
const meta = m => [fmt(m.date), m.place].filter(Boolean).map(esc).join(' · ');
const byId = id => M.find(m => m.id === id);
const sorted = () => [...M].sort((a,b) => (b.date||'').localeCompare(a.date||'') || b.created - a.created);
let toastT;
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2000); }
function sheet(html){ const s = $('#sheet'); s.innerHTML = `<div class="box"><div class="hd"></div>${html}</div>`; s.style.display = 'flex'; }
function closeSheet(){ $('#sheet').style.display = 'none'; }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

function scale(img, max, q){
  const r = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
async function loadImg(file){
  if (window.createImageBitmap){ try{ return await createImageBitmap(file, {imageOrientation:'from-image'}); }catch(e){} }
  return await new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('decode')); };
    im.src = u;
  });
}
async function readImage(file){ const img = await loadImg(file); return {photo: scale(img, 1000, .78), thumb: scale(img, 360, .7)}; }

/* ================= ICONS ================= */
const sv = (p, s=22, w=1.4) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ic = {
  back: sv('<path d="M15 5l-7 7 7 7"/>'),
  menu: sv('<path d="M4 8h16M4 16h16"/>'),
  heart: sv('<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/>', 20),
  heartL: sv('<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/>', 24),
  plus: sv('<path d="M12 5v14M5 12h14"/>', 20),
  camera: sv('<path d="M4 8h3l1.6-2.4h6.8L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.6"/>', 30, 1.3),
  share: sv('<circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/>', 22),
  trash: sv('<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/>', 22),
  lock: sv('<rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/>', 14),
  grid: sv('<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>', 18),
  list: sv('<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>', 18),
  arrow: sv('<path d="M5 12h14M13 6l6 6-6 6"/>', 18),
  chev: sv('<path d="M9 5l7 7-7 7"/>', 18),
  shuffle: sv('<path d="M4 7h3.5c3 0 4 2 5 5s2 5 5 5H20M4 17h3.5c1.4 0 2.4-.5 3.2-1.4M13 8.4C13.8 7.5 14.8 7 16.5 7H20M17.5 4.5L20 7l-2.5 2.5M17.5 14.5L20 17l-2.5 2.5"/>', 20),
  book: sv('<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/>'),
  shield: sv('<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>'),
  jar: (s=64) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="19" y="6" width="26" height="8" rx="3"/><path d="M22 14v3c-5 2-8 5-8 10v20c0 5 4 9 9 9h18c5 0 9-4 9-9V27c0-5-3-8-8-10v-3"/><path d="M32 45c-6-4-9-7-9-11a5 5 0 019-3 5 5 0 019 3c0 4-3 7-9 11z"/></svg>`
};

/* ================= STATE ================= */
const ui = {screen:'home', stack:[], filter:'all', view:'list', id:null, draft:null, editing:null, jarId:null};
function go(s, replace){ if (!replace) ui.stack.push(ui.screen); ui.screen = s; render(); }
function back(){ ui.screen = ui.stack.pop() || 'home'; render(); }
function resetTo(s){ ui.stack = s === 'home' ? [] : ['home']; ui.screen = s; render(); }

/* ================= SCREENS ================= */
function jarSVG(m, cls=''){
  const short = m ? (m.title.length > 20 ? m.title.slice(0,19) + '…' : m.title) : '';
  const photo = m && m.thumb
    ? `<image href="${m.thumb}" x="108" y="120" width="84" height="82" preserveAspectRatio="xMidYMid slice" clip-path="url(#pc)"/>`
    : `<rect x="108" y="120" width="84" height="82" fill="#24252a"/><text x="150" y="173" text-anchor="middle" font-size="28" fill="#8b8d97">♥</text>`;
  const hp = (x,y,k,o) => `<path transform="translate(${x} ${y}) scale(${k})" d="M0 5C-9-1-6-9 0-4 6-9 9-1 0 5z" fill="#fff" opacity="${o}"/>`;
  const st = (x,y,s,d) => { const q = s*.25, f = n => +n.toFixed(2); return `<path class="tw" style="animation-delay:${d}s" d="M${x} ${f(y-s)}L${f(x+q)} ${f(y-q)}L${f(x+s)} ${y}L${f(x+q)} ${f(y+q)}L${x} ${f(y+s)}L${f(x-q)} ${f(y+q)}L${f(x-s)} ${y}L${f(x-q)} ${f(y-q)}Z" fill="#fff" opacity=".8"/>`; };
  return `<svg class="jar ${cls}" id="jar" viewBox="0 0 300 340" aria-label="A jar holding a memory">
        <defs>
          <clipPath id="pc"><rect x="109" y="127" width="82" height="82" rx="2"/></clipPath>
          <clipPath id="jc"><path d="M94 64 L94 78 C94 92 60 98 60 126 L60 274 C60 306 84 322 118 322 L182 322 C216 322 240 306 240 274 L240 126 C240 98 206 92 206 78 L206 64 Z"/></clipPath>
          <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".18" stop-color="#fff" stop-opacity=".05"/><stop offset=".55" stop-color="#fff" stop-opacity=".015"/><stop offset=".86" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".17"/></linearGradient>
          <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43444b"/><stop offset=".45" stop-color="#1d1e22"/><stop offset="1" stop-color="#0c0c0e"/></linearGradient>
          <radialGradient id="floor" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
          <radialGradient id="inner" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        </defs>
        <ellipse cx="150" cy="326" rx="112" ry="13" fill="url(#floor)"/>
        <path d="M94 64 L94 78 C94 92 60 98 60 126 L60 274 C60 306 84 322 118 322 L182 322 C216 322 240 306 240 274 L240 126 C240 98 206 92 206 78 L206 64 Z" fill="url(#gl)"/>
        <path d="M94 64 L94 78 C94 92 60 98 60 126 L60 274 C60 306 84 322 118 322 L182 322 C216 322 240 306 240 274 L240 126 C240 98 206 92 206 78 L206 64 Z" fill="url(#inner)"/>
        <g clip-path="url(#jc)">
          <g transform="rotate(-16 113 240)"><rect x="78" y="198" width="70" height="88" rx="3" fill="#2b2c31" stroke="rgba(255,255,255,.14)"/><rect x="84" y="204" width="58" height="56" fill="#191a1e"/></g>
          <g transform="rotate(14 187 248)"><rect x="152" y="206" width="70" height="88" rx="3" fill="#232429" stroke="rgba(255,255,255,.12)"/><rect x="158" y="212" width="58" height="56" fill="#16171a"/></g>
          ${hp(96,304,.9,.38)}${hp(138,310,.75,.3)}${hp(184,306,.95,.4)}${hp(212,296,.7,.3)}${hp(118,290,.6,.26)}
          <g class="pol" id="pol"><g transform="rotate(-5 150 180)">
            <rect x="101" y="118" width="102" height="134" rx="3" fill="rgba(0,0,0,.4)"/>
            <rect x="99" y="114" width="102" height="134" rx="3" fill="#efece6"/>
            <rect x="131" y="106" width="38" height="13" fill="rgba(255,255,255,.5)" transform="rotate(-3 150 112)"/>
            ${photo}
            <text x="150" y="229" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="10.5" fill="#3a3a3f">${esc(short)}</text>
          </g></g>
          <circle class="tw" cx="82" cy="150" r="1.6" fill="#fff"/><circle class="tw" cx="224" cy="180" r="1.4" fill="#fff"/><circle class="tw" cx="90" cy="262" r="1.3" fill="#fff"/><circle class="tw" cx="216" cy="258" r="1.6" fill="#fff"/><circle class="tw" cx="150" cy="96" r="1.3" fill="#fff"/>
        </g>
        <path d="M94 64 L94 78 C94 92 60 98 60 126 L60 274 C60 306 84 322 118 322 L182 322 C216 322 240 306 240 274 L240 126 C240 98 206 92 206 78 L206 64 Z" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.6"/>
        <path d="M72 138C70 176 70 226 73 266" stroke="rgba(255,255,255,.34)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M74 282C76 292 80 298 88 303" stroke="rgba(255,255,255,.22)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M102 90C86 97 74 106 69 124" stroke="rgba(255,255,255,.3)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M229 146L230 214" stroke="rgba(255,255,255,.15)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <rect x="90" y="54" width="120" height="13" rx="3" fill="rgba(255,255,255,.09)" stroke="rgba(255,255,255,.4)"/>
        <rect x="82" y="20" width="136" height="38" rx="9" fill="url(#lid)" stroke="rgba(255,255,255,.45)" stroke-width="1.4"/>
        <path d="M92 27H208" stroke="rgba(255,255,255,.35)" stroke-linecap="round"/>
        <path d="M94 32V52M101 32V52M108 32V52M115 32V52M122 32V52M129 32V52M136 32V52M143 32V52M150 32V52M157 32V52M164 32V52M171 32V52M178 32V52M185 32V52M192 32V52M199 32V52M206 32V52" stroke="rgba(255,255,255,.09)"/>
        <path d="M86 54H214" stroke="rgba(0,0,0,.5)" stroke-width="2"/>
        ${st(52,120,5,0)}${st(252,150,6,1)}${st(60,236,4,2)}${st(246,246,5,.6)}${st(118,10,3.5,1.6)}${st(196,8,3,2.4)}
      </svg>`;
}

const bar = ({back=true, right=''}={}) => `<div class="bar"><div>${back?`<button class="ib" data-act="back" aria-label="Back">${ic.back}</button>`:''}</div><div class="c"><span class="brand">Memory Jar</span></div><div class="r">${right}</div></div>`;
const S = {
home(){
  const latest = sorted()[0] || null;
  return {
    head: '',
    body: `<div class="homej" data-act="start"><div class="spacer"></div>${jarSVG(latest, 'flt')}<h1 class="metal homet">MEMORY JAR</h1><div class="spacer"></div></div>`,
    foot: `<button class="btn" data-act="start">Tap to start ${ic.arrow}</button>`
  };
},
list(){
  const all = sorted();
  const f = ui.filter;
  const items = all.filter(m => f==='photos' ? m.thumb : f==='texts' ? !m.thumb : f==='liked' ? m.liked : true);
  const chip = (k, l) => `<button class="chip ${f===k?'on':''}" data-act="filter" data-v="${k}">${l}</button>`;
  let content;
  if (!all.length) {
    content = `<div class="empty center"><div class="ji">${ic.jar(64)}</div><h2>No memories yet</h2><p>Start your jar by adding your first special moment together.</p></div>`;
  } else {
    if (!items.length) content = `<div class="empty center"><p>Nothing here yet.</p></div>`;
    else if (ui.view === 'grid') content = `<div class="grid">${items.map(m => `<button class="g" data-act="open" data-v="${m.id}" aria-label="${esc(m.title)}">${m.thumb?`<img src="${m.thumb}" alt="">`:`<span>${esc(m.title)}</span>`}${m.liked?`<i>${sv('<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/>',16).replace('fill="none"','fill="currentColor"')}</i>`:''}</button>`).join('')}</div>`;
    else content = `<div class="list">${items.map(m => `<div class="row glass" data-act="open" data-v="${m.id}" role="button" tabindex="0">
      <div class="th">${m.thumb?`<img src="${m.thumb}" alt="">`:ic.heart}</div>
      <div class="rt"><b>${esc(m.title)}</b><small>${meta(m)}</small>${m.note?`<em>“${esc(m.note)}”</em>`:''}</div>
      <button class="hv ${m.liked?'on':''}" data-act="like" data-v="${m.id}" aria-label="Like">${ic.heart}</button></div>`).join('')}</div>`;
  }
  return {
    head: bar({right: `${all.length ? `<button class="ib" data-act="openJar" aria-label="Open the jar">${ic.jar(24)}</button>` : ''}<button class="ib" data-act="about" aria-label="Menu">${ic.menu}</button>`}),
    body: `<h1 class="pt">Your Memories</h1><p class="ps">${all.length ? 'A collection of moments, big and small.' : 'All your saved moments together.'}</p>
      ${all.length ? `<div class="tools"><div class="chips">${chip('all','All')}${chip('photos','Photos')}${chip('texts','Texts')}${chip('liked','Liked')}</div>
      <button class="vt" data-act="view" aria-label="Switch view">${ui.view==='grid'?ic.list:ic.grid}</button></div>` : ''}
      ${content}`,
    foot: `<button class="btn" data-act="add">${ic.plus} Add a Memory</button>`
  };
},
add(){
  const d = ui.draft, ed = !!ui.editing;
  return {
    head: bar(),
    body: `<h1 class="pt">${ed?'Edit Memory':'Add a Memory'}</h1><p class="ps">Capture a moment, save a feeling.</p>
      <div class="drop">
        ${d.photo ? `<img src="${d.photo}" alt=""><div class="chg"><span>Change</span></div>`
          : `${ic.camera}<b>Add Photo</b><small>Tap to choose or take a photo</small>`}
        <input id="file" type="file" accept="image/*" aria-label="Add photo">
      </div>
      ${d.photo ? `<button class="rmp" data-act="rmPhoto">Remove photo</button>` : ''}
      <div class="fl"><span>Title</span><small id="c1">${d.title.length}/50</small></div>
      <input class="in" id="f_title" maxlength="50" placeholder="e.g. Our first trip, late night talks…" value="${esc(d.title)}" autocomplete="off">
      <div class="fl"><span>Date</span></div>
      <input class="in" id="f_date" type="date" value="${esc(d.date)}" max="${today()}">
      <div class="fl"><span>Place (optional)</span></div>
      <input class="in" id="f_place" maxlength="30" placeholder="e.g. Delhi" value="${esc(d.place)}" autocomplete="off">
      <div class="fl"><span>Notes (optional)</span><small id="c2">${d.note.length}/200</small></div>
      <textarea class="in" id="f_note" maxlength="200" placeholder="Write something about this moment…">${esc(d.note)}</textarea>`,
    foot: `<button class="btn" data-act="save">${ed?'Save Changes':'Save Memory'}</button>`
  };
},
detail(){
  const m = byId(ui.id);
  if (!m) { ui.screen = 'list'; return S.list(); }
  return {
    head: bar(),
    body: `<div class="photo ${m.photo?'':'none'}">${m.photo?`<img src="${m.photo}" alt="">`:ic.jar(48)}</div>
      <h1 class="dh">${esc(m.title)}</h1><p class="dm">${meta(m)}</p>
      ${m.note ? `<p class="quote">${esc(m.note)}</p>` : `<div style="height:22px"></div>`}
      <div class="spacer"></div>
      <div class="acts">
        <button class="act ${m.liked?'on':''}" data-act="like" data-v="${m.id}"><span class="c">${ic.heartL}</span>Like</button>
        <button class="act" data-act="share"><span class="c">${ic.share}</span>Share</button>
        <button class="act" data-act="askDel"><span class="c">${ic.trash}</span>Delete</button>
      </div>`,
    foot: `<button class="btn dark" data-act="edit">Edit Memory</button>`
  };
},
jar(){
  const m = byId(ui.jarId);
  if (!m) { ui.screen = 'list'; return S.list(); }
  return {
    head: bar(),
    body: `<div class="jarwrap">
      ${jarSVG(m)}
      <p class="jt">Here's a random memory<br>for you…</p>
      <button class="mini glass" data-act="open" data-v="${m.id}">
        <div class="th">${m.thumb?`<img src="${m.thumb}" alt="">`:ic.heart}</div>
        <div class="rt"><b>${esc(m.title)}</b><small>${meta(m)}</small>${m.note?`<em>“${esc(m.note)}”</em>`:''}</div>
      </button></div>`,
    foot: `<button class="btn" data-act="another">${ic.shuffle} Another Memory</button>`
  };
},
about(){
  const row = (i, t, act, cls='') => `<button class="ar ${cls}" data-act="${act}">${i}<span>${t}</span><span class="ch" style="flex:none">${ic.chev}</span></button>`;
  return {
    head: bar(),
    body: `<div class="center" style="margin-top:22px;color:var(--ink2)">${ic.heartL}<h1 class="pt" style="margin-top:18px;color:var(--ink)">Small moments.<br>Big love.</h1></div>
      <div class="al">${row(ic.book,'Memory Jar Guide','guide')}${row(ic.shield,'Privacy &amp; Security','privacy')}${M.length ? row(ic.trash,'Delete All Memories','askClear','warm') : ''}</div>
      <div class="spacer"></div>
      <p class="safe" style="margin-bottom:6px">${ic.lock} Your memories are private ♥</p>`
  };
}
};

/* ================= RENDER ================= */
function render(anim=true){
  const r = S[ui.screen]();
  $('#app').dataset.s = ui.screen;
  $('#head').innerHTML = r.head || '';
  const b = $('#body'); b.innerHTML = r.body || '';
  const f = $('#foot'); f.innerHTML = r.foot || ''; f.style.display = r.foot ? 'block' : 'none';
  if (anim){ b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter'); b.scrollTop = 0; }
}

/* ================= ACTIONS ================= */
function newDraft(m){ ui.draft = m ? {title:m.title, date:m.date, place:m.place||'', note:m.note||'', photo:m.photo||'', thumb:m.thumb||''} : {title:'', date:today(), place:'', note:'', photo:'', thumb:''}; }
function pickJar(){
  if (!M.length) return null;
  let id; const pool = M.filter(m => m.id !== ui.jarId);
  id = (pool.length ? pool : M)[Math.floor(Math.random() * (pool.length || M.length))].id;
  return id;
}
async function shareMemory(){
  const m = byId(ui.id); if (!m) return;
  const text = `${m.title}\n${[fmt(m.date), m.place].filter(Boolean).join(' · ')}${m.note ? `\n“${m.note}”` : ''}\n\nFrom our Memory Jar ♥`;
  const canNative = !!navigator.share;
  sheet(`<h3>Share Memory</h3><p>Want to share this moment with someone?<br>(Or just keep it to yourselves.)</p>
    <div class="stack">${canNative ? `<button class="btn" data-act="nativeShare">Share…</button>` : ''}<button class="btn ${canNative?'dark':''}" data-act="copyText">Copy text</button><button class="btn dark" data-act="closeSheet">Cancel</button></div>`);
  shareMemory.text = text;
}
const act = {
  back(){ back(); },
  start(){ go('list'); },
  about(){ go('about'); },
  add(){ ui.editing = null; newDraft(null); go('add'); },
  edit(){ const m = byId(ui.id); if (!m) return; ui.editing = m.id; newDraft(m); go('add'); },
  list(){ go('list'); },
  filter(t){ ui.filter = t.dataset.v; render(false); },
  view(){ ui.view = ui.view === 'grid' ? 'list' : 'grid'; render(false); },
  open(t){ ui.id = t.dataset.v; go('detail'); },
  like(t){
    const m = byId(t.dataset.v); if (!m) return;
    m.liked = !m.liked; DB.put(m); render(false);
  },
  rmPhoto(){ ui.draft.photo = ''; ui.draft.thumb = ''; render(false); },
  save(){
    const d = ui.draft;
    d.title = d.title.trim(); d.note = d.note.trim(); d.place = d.place.trim();
    if (!d.title && !d.note && !d.photo) return toast('Add a title, note or photo first');
    const data = {title: d.title || 'Untitled moment', date: d.date || today(), place: d.place, note: d.note, photo: d.photo, thumb: d.thumb};
    if (ui.editing){
      const m = byId(ui.editing); Object.assign(m, data); DB.put(m); toast('Memory updated'); ui.editing = null; back();
    } else {
      const m = {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), created: Date.now(), liked: false, ...data};
      M.push(m); DB.put(m); toast('Saved to your jar ♥'); ui.filter = 'all'; ui.id = m.id;
      ui.stack = ['home']; ui.screen = 'list'; render();
    }
  },
  openJar(){
    if (!M.length) return go('list');
    ui.jarId = pickJar(); if (ui.screen === 'list' || ui.screen === 'home') go('jar'); else go('jar');
  },
  another(){
    ui.jarId = pickJar(); render(false);
    const j = $('#jar'); if (j){ void j.getBoundingClientRect(); j.classList.add('wob'); setTimeout(() => j.classList.remove('wob'), 750); }
  },
  share: shareMemory,
  async nativeShare(){
    const m = byId(ui.id); closeSheet(); if (!m) return;
    try{
      const data = {title: m.title, text: shareMemory.text};
      if (m.photo && navigator.canShare){
        const blob = await (await fetch(m.photo)).blob();
        const file = new File([blob], 'memory.jpg', {type:'image/jpeg'});
        if (navigator.canShare({files:[file]})) data.files = [file];
      }
      await navigator.share(data);
    }catch(e){}
  },
  async copyText(){
    closeSheet();
    try{ await navigator.clipboard.writeText(shareMemory.text); toast('Copied'); }
    catch(e){ toast('Could not copy'); }
  },
  closeSheet(){ closeSheet(); },
  askDel(){
    sheet(`<h3>Delete this memory?</h3><p>This can't be undone.</p><div class="stack"><button class="btn warm" data-act="doDel">Delete</button><button class="btn dark" data-act="closeSheet">Cancel</button></div>`);
  },
  doDel(){
    const m = byId(ui.id); closeSheet(); if (!m) return;
    M = M.filter(x => x.id !== m.id); DB.del(m.id); toast('Memory deleted'); resetTo('list');
  },
  guide(){
    sheet(`<h3>Memory Jar Guide</h3><ol><li>Tap <b>Add a Memory</b> and pick a photo.</li><li>Give it a title, a date and a few words.</li><li>Open the jar any time for a random memory.</li><li>Tap the heart on the ones you love most.</li></ol><button class="btn dark" data-act="closeSheet" style="height:52px">Close</button>`);
  },
  privacy(){
    sheet(`<h3>Privacy &amp; Security</h3><p>Everything you save stays on this device only. There is no account, no server and no tracking. Clearing this browser's site data will remove your memories.</p><button class="btn dark" data-act="closeSheet" style="height:52px">Close</button>`);
  },
  askClear(){
    sheet(`<h3>Delete all memories?</h3><p>Every memory in your jar will be removed from this device. This can't be undone.</p><div class="stack"><button class="btn warm" data-act="doClear">Delete All</button><button class="btn dark" data-act="closeSheet">Cancel</button></div>`);
  },
  doClear(){ closeSheet(); M = []; DB.clear(); toast('Jar emptied'); resetTo('home'); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t && act[t.dataset.act]) act[t.dataset.act](t, e);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row[data-act]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  const id = e.target.id, d = ui.draft; if (!d) return;
  if (id === 'f_title'){ d.title = e.target.value; $('#c1').textContent = d.title.length + '/50'; }
  else if (id === 'f_date') d.date = e.target.value;
  else if (id === 'f_place') d.place = e.target.value;
  else if (id === 'f_note'){ d.note = e.target.value; $('#c2').textContent = d.note.length + '/200'; }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'file') return;
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try{ toast('Preparing photo…'); const r = await readImage(f); Object.assign(ui.draft, r); render(false); toast('Photo added'); }
  catch(err){ toast('Could not read that photo, try another'); e.target.value = ''; }
});

/* ================= START ================= */
(async function init(){
  render();
  await DB.open();
  M = await DB.all();
  render(false);
})();
</script>
</body>
</html>
