<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050506">
<title>Notes</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --ink:#f6f6f8; --ink2:rgba(246,246,248,.66); --ink3:rgba(246,246,248,.4);
  --line:rgba(255,255,255,.12); --glass:rgba(255,255,255,.06);
  --paper-ink:#2d2a32;
  --metal:linear-gradient(180deg,#fff 0%,#dcdfe6 40%,#8e929e 100%);
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --hand:'Bradley Hand','Noteworthy','Segoe Print','Segoe Script','Marker Felt','Comic Sans MS','Comic Neue',cursive;
  --mono:ui-monospace,'SF Mono','Cascadia Mono','Courier New',monospace;
  --fam:var(--hand); --fs:22px; --fsw:16.5px;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:#050506;color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input,textarea{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
.serif{font-family:var(--serif);font-weight:400}
.metal{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(80% 32% at 50% 0%,rgba(255,255,255,.06),transparent 70%),#050506;contain:strict}
#bg.plain{background:#000}
#app{position:relative;z-index:1;max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 12px 4px;min-height:58px}
.bar>div:first-child{display:flex;justify-content:flex-start}
.bar .r{display:flex;justify-content:flex-end}
.bar .bt{text-align:center;font-family:var(--serif);font-size:19px;color:var(--ink)}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:background .2s,color .2s}
.ib:active,.ib:focus-visible{background:var(--glass);color:#fff;outline:none}
#body{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 22px 22px;display:flex;flex-direction:column;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#body::-webkit-scrollbar{display:none}
#body.enter>*{animation:in .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
#foot{flex:none;padding:10px 22px 18px}
.spacer{flex:1;min-height:14px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}

.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:20px;font-size:15px;font-weight:500;letter-spacing:.04em;color:#0a0a0c;
  background:linear-gradient(180deg,#fff,#e6e8ee 55%,#b9bdc8);border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 26px rgba(255,255,255,.08),inset 0 1px 0 #fff;transition:transform .15s}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);opacity:.7;animation:sheen 6s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,55%{transform:translate3d(0,0,0) skewX(-20deg)}100%{transform:translate3d(520%,0,0) skewX(-20deg)}}
.btn:active{transform:scale(.975)}
.btn.ghost{color:var(--ink);font-weight:400;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.btn.ghost::after{display:none}
.btn:focus-visible,.row:focus-visible,.chip:focus-visible,.paper:focus-visible,.swc:focus-visible,.stk:focus-visible,.key:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sub{color:var(--ink2);font-size:14px;margin:8px 0 0;line-height:1.55}
h1,h2,h3{margin:0}
.ttl{font-size:30px;line-height:1.18}

/* splash */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;text-align:center}
.splash svg{width:min(78%,290px);height:auto;overflow:visible}
.splash .fl{animation:flt 7s ease-in-out infinite}
.splash .fl2{animation:flt 8s ease-in-out -2s infinite}
.splash .fl3{animation:flt 9s ease-in-out -4s infinite}
@keyframes flt{50%{transform:translate3d(0,-7px,0)}}
.splash h1{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:.24em;padding-left:.24em;margin-top:22px;width:100%}

/* wall */
.tools{display:flex;align-items:center;gap:8px;margin:18px 0 16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;margin-right:-6px;padding-right:6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:20px;font-size:13px;color:var(--ink2);border:1px solid var(--line);background:var(--glass);transition:all .2s;white-space:nowrap}
.chip.on{color:#0a0a0c;background:linear-gradient(180deg,#fff,#d8dbe2);border-color:#fff;font-weight:500}
.vt{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);border:1px solid var(--line);background:var(--glass)}
.vt:active{color:#fff}
.wall{column-count:2;column-gap:14px;padding:4px 2px 0}

/* papers: colour + pattern + font */
.ps-ruled{--pat:repeating-linear-gradient(transparent 0 33px,rgba(45,42,50,.09) 33px 34px);--bp:0 10px}
.ps-dots{--pat:radial-gradient(rgba(45,42,50,.22) 1.3px,transparent 1.7px);--sz:22px 22px;--bp:6px 8px}
.ps-grid{--pat:linear-gradient(rgba(45,42,50,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(45,42,50,.08) 1px,transparent 1px);--sz:24px 24px;--bp:0 0}
.ps-plain{--pat:none}
.f-hand{--fam:var(--hand);--fs:22px;--fsw:16.5px}
.f-serif{--fam:var(--serif);--fs:21px;--fsw:15.5px}
.f-clean{--fam:var(--sans);--fs:18px;--fsw:14px}
.f-type{--fam:var(--mono);--fs:17px;--fsw:13px}
.paper::before,.sheet::before{content:"";position:absolute;inset:0;background-image:var(--pat,none);background-size:var(--sz,auto);background-position:var(--bp,0 0);pointer-events:none;border-radius:inherit}
.paper.ps-ruled{--pat:repeating-linear-gradient(transparent 0 22px,rgba(45,42,50,.09) 22px 23px);--bp:0 12px}
.paper{position:relative;display:block;width:100%;break-inside:avoid;margin:0 0 16px;padding:26px 15px 14px;text-align:left;border-radius:3px;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 40%),var(--c);color:var(--paper-ink);
  box-shadow:0 8px 18px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.35) inset;transform:rotate(var(--r,0deg));transition:transform .2s}
.paper:active{transform:rotate(var(--r,0deg)) scale(.97)}
.paper .tape{position:absolute;top:-9px;left:50%;width:54px;height:18px;margin-left:-27px;background:rgba(255,255,255,.42);transform:rotate(-3deg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.paper .pt,.paper .pl,.paper .pf,.paper .rm{position:relative}
.paper .pt{margin:0;font-family:var(--fam);font-size:var(--fsw);line-height:1.42;word-break:break-word;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.paper .pl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-family:var(--fam);font-size:var(--fsw);line-height:1.3}
.paper .pl li{display:flex;gap:8px;align-items:flex-start;word-break:break-word}
.paper .pl i{flex:none;width:13px;height:13px;margin-top:2px;border-radius:4px;border:1.6px solid var(--paper-ink);opacity:.7;display:grid;place-items:center;color:transparent}
.paper .pl li.done i{background:var(--paper-ink);color:#fff}
.paper .pl li.done span{text-decoration:line-through;opacity:.5}
.paper .pf{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:12px;font-family:var(--fam);font-size:calc(var(--fsw) - 2px);opacity:.8}
.paper .pf svg{flex:none;opacity:.85}
.paper .fv{position:absolute;top:8px;right:9px;color:var(--paper-ink);opacity:.75}
.paper .pn{position:absolute;top:6px;left:8px;color:var(--paper-ink);opacity:.8}
.paper .rm{display:flex;align-items:center;gap:5px;font-family:var(--sans);font-size:10.5px;opacity:.75;margin-top:8px}
.tagp{display:inline-block;font-family:var(--sans);font-size:10px;letter-spacing:.06em;padding:2px 8px;border-radius:10px;background:rgba(45,42,50,.13);margin-top:8px}
.empty{margin:auto 0;padding-bottom:60px}
.empty .mini{width:96px;height:auto;margin-bottom:18px}
.empty h2{font-family:var(--serif);font-weight:400;font-size:26px}
.empty p{color:var(--ink2);font-size:14px;line-height:1.6;margin:10px 0 0;max-width:250px}

/* sheet (write + read) */
.sheet{position:relative;width:100%;min-height:250px;padding:30px 20px 18px;border-radius:4px;color:var(--paper-ink);
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 35%),var(--c);
  box-shadow:0 14px 34px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.4) inset;transition:background-color .25s}
.sheet .tape{position:absolute;top:-10px;left:50%;width:70px;height:22px;margin-left:-35px;background:rgba(255,255,255,.42);transform:rotate(-2.5deg);box-shadow:0 1px 3px rgba(0,0,0,.2);z-index:2}
.sheet textarea,.sheet .txt,.sheet .sig,.sheet .clist{position:relative;z-index:1}
.sheet textarea{display:block;width:100%;min-height:210px;background:none;border:0;outline:0;resize:none;font-family:var(--fam);font-size:var(--fs);line-height:34px;color:var(--paper-ink);padding:0}
.sheet textarea::placeholder,.sheet .cit::placeholder{color:rgba(45,42,50,.45)}
.sheet .stkd{position:absolute;top:14px;right:16px;color:var(--paper-ink);opacity:.8;z-index:2}
.sheet .sig{text-align:right;font-family:var(--fam);font-size:calc(var(--fs) - 2px);margin-top:6px;opacity:.85}
.sheet.read{padding:38px 22px 22px;transform:rotate(-1.2deg);transform-origin:top center}
.sheet.read .txt{margin:0;font-family:var(--fam);font-size:var(--fs);line-height:34px;word-break:break-word;white-space:pre-wrap}
.sheet.unfold{animation:unfold .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes unfold{0%{opacity:0;transform:perspective(700px) rotateX(-80deg) scaleY(.35)}55%{opacity:1}100%{opacity:1;transform:rotate(-1.2deg)}}
.clist{display:flex;flex-direction:column;padding-right:34px}
.ci{display:flex;align-items:center;gap:12px;min-height:34px;text-align:left;width:100%}
.cb{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--paper-ink);opacity:.78;display:grid;place-items:center;color:transparent;transition:background .15s}
.cb.on{background:var(--paper-ink);color:#fff;opacity:1}
.ci .t{flex:1;min-width:0;font-family:var(--fam);font-size:var(--fs);line-height:34px;word-break:break-word}
.ci.done .t,.ci.done .cit{text-decoration:line-through;opacity:.5}
.cit{flex:1;min-width:0;background:none;border:0;outline:0;font-family:var(--fam);font-size:var(--fs);line-height:34px;color:var(--paper-ink);padding:0}
.cx{flex:none;width:30px;height:30px;display:grid;place-items:center;color:var(--paper-ink);opacity:.5;border-radius:50%}
.cx:active{opacity:1}
.addi{display:flex;align-items:center;gap:10px;font-family:var(--fam);font-size:calc(var(--fs) - 2px);color:var(--paper-ink);opacity:.65;min-height:38px;width:100%;text-align:left}
.prog2{margin:14px 0 0;font-size:12.5px;color:var(--ink3);text-align:center;letter-spacing:.04em}
.cnt{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin:12px 4px 0}
.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:22px 4px 10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:18px;margin-bottom:22px}
.seg button{height:40px;border-radius:14px;font-size:14px;color:var(--ink2);transition:all .2s}
.seg button.on{color:#0a0a0c;background:linear-gradient(180deg,#fff,#d8dbe2);font-weight:500}
.swcs{display:flex;gap:12px;flex-wrap:wrap;padding:0 2px}
.swc{width:36px;height:36px;border-radius:50%;background:var(--c);border:2px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.15);transition:transform .15s,border-color .2s}
.swc.on{border-color:#fff;transform:scale(1.14);box-shadow:0 0 0 2px #050506,0 0 14px rgba(255,255,255,.25)}
.stks{display:flex;gap:8px;flex-wrap:nowrap}
.stk{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--ink2);border:1px solid var(--line);background:var(--glass);transition:all .2s;flex:none}
.stk.on{color:#0a0a0c;background:#fff;border-color:#fff}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts .chip{height:38px;padding:0 15px}
.fnt{font-size:16px}
.remrow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:18px;color:var(--ink2)}
.remrow input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px;color:var(--ink);color-scheme:dark;padding:8px 0}
.note2{font-size:12px;color:var(--ink3);margin:8px 4px 0;line-height:1.5}
.acts{display:flex;justify-content:space-between;margin:26px 2px 8px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2);flex:1}
.act .c{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--glass);color:var(--ink);transition:transform .15s,background .2s}
.act:active .c{transform:scale(.92)}
.act.on .c{background:#fff;color:#0a0a0c;border-color:#fff}
.act.on .c svg{fill:currentColor}
.meta{text-align:center;color:var(--ink3);font-size:12.5px;margin-top:22px;letter-spacing:.04em;line-height:1.7}

/* settings */
.list{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.row{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;text-align:left;width:100%;transition:transform .15s}
.row:active{transform:scale(.985)}
.row .ri{color:var(--ink2);flex:none;display:grid;place-items:center}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:400;font-size:15px}
.row .rt small{display:block;color:var(--ink3);font-size:12px;margin-top:3px;line-height:1.4}
.row .ch{color:var(--ink3);flex:none}
.sw{width:46px;height:28px;border-radius:20px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#9a9ea9;transition:transform .25s,background .25s}
.sw.on{background:rgba(255,255,255,.35)} .sw.on::after{transform:translateX(18px);background:#fff}

/* lock */
.lockw{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.lockw .li{color:var(--ink2);margin-top:20px}
.dots{display:flex;gap:16px;margin:26px 0 30px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);transition:background .15s,transform .15s}
.dots i.on{background:#fff;border-color:#fff;transform:scale(1.1)}
.dots.bad{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;justify-content:center}
.key{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:30px;background:var(--glass);border:1px solid var(--line);transition:transform .12s,background .2s}
.key:active{transform:scale(.92);background:rgba(255,255,255,.18)}
.key.ghost{background:none;border-color:transparent;font-size:14px;color:var(--ink2)}
.key.none{visibility:hidden}
.lk{color:var(--ink2);font-size:13px;padding:14px;margin-top:14px}

#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:28px;background:rgba(0,0,0,.75)}
#modal .box{max-width:340px;width:100%;padding:28px 22px 18px;text-align:center;background:rgba(16,16,19,.98);animation:in .3s both}
#modal h3{font-family:var(--serif);font-weight:400;font-size:22px}
#modal p{color:var(--ink2);font-size:14px;line-height:1.6;margin:10px 0 22px;word-break:break-word}
#modal .acts2{display:flex;gap:10px}
#modal .acts2 .btn{height:48px}
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,10px);z-index:30;padding:11px 18px;border-radius:16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;background:rgba(18,18,21,.97);border:1px solid var(--line);white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

#hubNav{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:14px;z-index:15;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  opacity:.55;transition:opacity .2s,background .2s;touch-action:manipulation}
#hubNav:active{opacity:1;background:rgba(255,255,255,.16)}
@media (min-width:431px){#hubNav{left:calc(50% - 205px + 14px)}}
</style>
</head>
<body>
<button id="hubNav" aria-label="All Apps" title="All Apps"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg></button>
<script>document.getElementById('hubNav').addEventListener('click', function(){ location.href = '../../index.html'; });</script>

<div id="bg"></div>
<div id="app"><div id="head"></div><main id="body"></main><div id="foot"></div></div>
<div id="modal"></div>
<div id="toast" role="status"></div>

<script>
/* ================= DATA ================= */
const COLORS = ['#f9c5d1','#fbe7a1','#bfe8d2','#bcd9f5','#d6c9f2','#fbd0b0','#f2efe8'];
const TAGS = ['Ideas','To-do','Shopping','Feelings','Work','Goals'];
const STYLES = [['ruled','Ruled'],['plain','Plain'],['dots','Dots'],['grid','Grid']];
const FONTS = [['hand','Handwritten'],['serif','Serif'],['clean','Clean'],['type','Typewriter']];
const KEY = 'notes-app-v1';
const DEF = {settings:{sound:true}, notes:[], lock:{on:false, salt:'', hash:''}};
let S = load();
function load(){
  try{ const r = JSON.parse(localStorage.getItem(KEY));
    if (r) return {...JSON.parse(JSON.stringify(DEF)), ...r, settings:{...DEF.settings, ...(r.settings||{})}, lock:{...DEF.lock, ...(r.lock||{})}}; }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Could not save on this device'); } }
const ui = {screen: S.lock.on ? 'lock' : 'splash', filter:'all', id:null, unfold:false, draft:null, pin:{mode:'unlock', buf:'', first:'', then:''}, hiddenAt:0};

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = id => S.notes.find(n => n.id === id);
const rot = id => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 997; return ((h % 5) - 2) * 0.9; };
const shortDate = ts => new Date(ts).toLocaleDateString(undefined, {day:'numeric', month:'short'});
const fmt = ts => new Date(ts).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'});
const fmtT = ts => new Date(ts).toLocaleString(undefined, {day:'numeric', month:'short', hour:'numeric', minute:'2-digit'});
const localVal = ts => { const d = new Date(ts - new Date(ts).getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); };

function beep(f=520, d=.14, v=.03){ if (!S.settings.sound) return;
  try{ ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(v, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+d); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+d); }catch(e){} }

}

function bar({back, title, gear}){
  const l = back ? `<button class="ib" data-act="go" data-v="${back}" aria-label="Back">${ic.back}</button>` : '';
  const r = gear ? `<button class="ib" data-act="go" data-v="settings" aria-label="Settings">${ic.gear}</button>` : '';
  return `<div class="bar"><div>${l}</div><div class="bt">${title || ''}</div><div class="r">${r}</div></div>`;
}
const listItems = n => (n.items || []);

  const pending = n.remind && !n.reminded;
  const body = nType(n) === 'list'
    ? `<ul class="pl">${listItems(n).slice(0, 6).map(it => `<li class="${it.d ? 'done' : ''}"><i>${it.d ? ic.tick : ''}</i><span>${esc(it.t)}</span></li>`).join('')}${listItems(n).length > 6 ? `<li><span style="opacity:.6">+${listItems(n).length - 6} more</span></li>` : ''}</ul>`
    : `<p class="pt">${esc(n.text)}</p>`;
  const done = nType(n) === 'list' ? `${listItems(n).filter(i => i.d).length}/${listItems(n).length}` : shortDate(n.ts);
  return `<button class="paper ps-${nStyle(n)} f-${nFont(n)}" style="--c:${n.color};--r:${rot(n.id)}deg" data-act="open" data-v="${n.id}"><i class="tape"></i>

    <div class="pf"><span>${done}</span>${stk(n.sticker, 20)}</div></button>`;
}
const sortNotes = () => [...S.notes].sort((a, b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || b.ts - a.ts);

/* ================= RENDER ================= */
function render(anim=true){
  const r = SC[ui.screen]();
  $('#head').innerHTML = r.head || '';
  const b = $('#body'); b.innerHTML = r.body || '';
  const f = $('#foot'); f.innerHTML = r.foot || ''; f.style.display = r.foot ? 'block' : 'none';
  $('#bg').classList.toggle('plain', !!r.plain);
  if (r.after) r.after();
  if (anim){ b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter'); b.scrollTop = 0; }
}
function go(s){ ui.screen = s; render(); }
/* keep the write screen's picked options highlighted without re-rendering (keeps the keyboard open) */
function syncWrite(){
  const d = ui.draft, p = $('#pp'); if (!p) return;
  p.className = `sheet ps-${d.style} f-${d.font}`; p.style.setProperty('--c', d.color);
  $('#stkd').innerHTML = stk(d.sticker, 30);
  document.querySelectorAll('[data-k]').forEach(el => el.classList.toggle('on', String(d[el.dataset.k] || '') === el.dataset.v));
}

/* ================= PIN LOCK ================= */
async function hashPin(pin, salt){
  try{ const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin)); return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch(e){ let h = 5381; for (const c of salt + ':' + pin) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'x' + h; }
}
function setPin(mode, then){ ui.pin = {mode, buf:'', first:'', then: then || ''}; ui.screen = 'lock'; render(false); }
async function pinDone(){
  const p = ui.pin, pin = p.buf;
  if (p.mode === 'unlock' || p.mode === 'verify'){
    const ok = (await hashPin(pin, S.lock.salt)) === S.lock.hash;
    if (!ok){ buzz(60); const d = $('#dots'); if (d){ d.classList.add('bad'); } setTimeout(() => { ui.pin.buf = ''; render(false); }, 420); return; }
    if (p.mode === 'unlock'){ ui.screen = 'wall'; render(); checkReminders(); return; }
    if (p.then === 'off'){ S.lock = {on:false, salt:'', hash:''}; save(); toast('App lock off'); go('settings'); return; }
    if (p.then === 'change'){ setPin('new1'); return; }
  } else if (p.mode === 'new1'){ ui.pin = {mode:'new2', buf:'', first:pin, then:''}; render(false); }
  else if (p.mode === 'new2'){
    if (pin !== p.first){ toast("PINs didn't match. Try again."); buzz(60); setPin('new1'); return; }
    const salt = Math.random().toString(36).slice(2); S.lock = {on:true, salt, hash: await hashPin(pin, salt)}; save(); toast('App lock on'); go('settings');
  }
}

/* ================= REMINDERS ================= */
let dueQueue = [];
function checkReminders(){
  if (ui.screen === 'lock' || $('#modal').style.display === 'flex') return;
  const now = Date.now();
  S.notes.filter(n => n.remind && !n.reminded && n.remind <= now).forEach(n => { n.reminded = true; dueQueue.push(n.id); });
  if (dueQueue.length) save();
  showDue();
}
function showDue(){
  if ($('#modal').style.display === 'flex') return;
  const id = dueQueue.shift(); if (!id) return;
  const n = byId(id); if (!n) return showDue();
  const preview = nType(n) === 'list' ? listItems(n).map(i => i.t).join(', ') : n.text;
  const msg = esc(preview.length > 110 ? preview.slice(0, 107) + '…' : preview);
  buzz([80, 60, 80]); beep(700, .25, .05);
  try{ if ('Notification' in window && Notification.permission === 'granted') new Notification('Reminder', {body: preview.slice(0, 120)}); }catch(e){}
  modal('Reminder ⏰', msg, [{label:'Dismiss', ghost:true, fn: () => { render(false); showDue(); }}, {label:'Open', fn: () => { ui.id = n.id; go('note'); setTimeout(showDue, 50); }}]);
}
setInterval(checkReminders, 15000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ ui.hiddenAt = Date.now(); return; }
  if (S.lock.on && ui.screen !== 'lock' && Date.now() - ui.hiddenAt > 15000){ setPin('unlock'); return; }
  checkReminders();
});

/* ================= ACTIONS ================= */
function openNote(id, unfold){ if (!byId(id)) return; ui.id = id; ui.unfold = !!unfold; buzz(unfold ? 20 : 8); if (unfold) beep(600, .2); go('note'); }
function newDraft(){ return {id:null, type:'text', text:'', items:[{t:'', d:false}], color:COLORS[Math.floor(Math.random() * COLORS.length)], sticker:'heart', style:'ruled', font:'hand', tag:'', remind:null}; }
const act = {
  start(){ go('wall'); },
  go(t){ go(t.dataset.v); },
  filter(t){ ui.filter = t.dataset.v; render(false); },
  write(){ ui.draft = newDraft(); go('write'); },
  setType(t){ ui.draft.type = t.dataset.v; render(false); },
  pick(t){ ui.draft[t.dataset.k] = t.dataset.v; syncWrite(); buzz(8); },
  clearRem(){ ui.draft.remind = null; $('#rem').value = ''; },
  addItem(){ if (ui.draft.items.length >= 20) return toast('20 items is the limit'); ui.draft.items.push({t:'', d:false}); render(false); const i = document.querySelectorAll('.cit'); if (i.length) i[i.length - 1].focus(); },
  delItem(t){ const d = ui.draft; d.items.splice(+t.dataset.v, 1); if (!d.items.length) d.items.push({t:'', d:false}); render(false); },
  tickD(t){ const it = ui.draft.items[+t.dataset.v]; it.d = !it.d; render(false); },
  edit(){
    const n = byId(ui.id); if (!n) return;
    ui.draft = {id:n.id, type:nType(n), text:n.text || '', items: listItems(n).length ? listItems(n).map(i => ({...i})) : [{t:'', d:false}], color:n.color, sticker:n.sticker || '', style:nStyle(n), font:nFont(n), tag:n.tag || '', remind: (n.remind && !n.reminded) ? n.remind : null, ts:n.ts};
    go('write');
  },
  saveNote(){
    const d = ui.draft, isList = d.type === 'list';
    const text = d.text.trim(), items = d.items.map(i => ({t:i.t.trim(), d:i.d})).filter(i => i.t);
    if (isList ? !items.length : !text){ toast(isList ? 'Add at least one item' : 'Write something first'); return; }
    const fields = {type:d.type, text: isList ? '' : text, items: isList ? items : [], color:d.color, sticker:d.sticker, style:d.style, font:d.font, tag:d.tag, remind:d.remind || null};
    if (fields.remind && 'Notification' in window && Notification.permission === 'default'){ try{ Notification.requestPermission(); }catch(e){} }
    if (d.id){
      const n = byId(d.id); if (!n) return go('wall');
      if (fields.remind !== (n.remind || null)) n.reminded = false;
      Object.assign(n, fields); save(); toast('Note updated'); ui.id = n.id; go('note');
    } else {
      S.notes.push({id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), ts:Date.now(), fav:false, pin:false, reminded:false, ...fields});
      save(); buzz(20); beep(520); toast(fields.remind ? 'Saved · reminder set' : 'Note saved'); ui.filter = 'all'; go('wall');
    }
  },
  open(t){ openNote(t.dataset.v, false); },
  draw(){
    if (!S.notes.length) return;
    const pool = S.notes.filter(n => n.id !== ui.id); const list = pool.length ? pool : S.notes;
    openNote(list[Math.floor(Math.random() * list.length)].id, true);
  },
  tick(t){ const n = byId(ui.id); if (!n) return; const it = listItems(n)[+t.dataset.v]; if (!it) return; it.d = !it.d; save(); buzz(10); render(false); },
  fav(){ const n = byId(ui.id); if (!n) return; n.fav = !n.fav; save(); buzz(); render(false); },
  togglePin(){ const n = byId(ui.id); if (!n) return; n.pin = !n.pin; save(); buzz(); toast(n.pin ? 'Pinned to the top' : 'Unpinned'); render(false); },
  async share(){
    const n = byId(ui.id); if (!n) return;
    const text = nType(n) === 'list' ? listItems(n).map(i => `${i.d ? '☑' : '☐'} ${i.t}`).join('\n') : `“${n.text}”`;
    try{ if (navigator.share) await navigator.share({title:'Note', text}); else { await navigator.clipboard.writeText(text); toast('Copied'); } }catch(e){}
  },
  askDel(){ confirmBox('Delete this note?', "This can't be undone.", 'Delete', () => { S.notes = S.notes.filter(n => n.id !== ui.id); save(); toast('Note deleted'); go('wall'); }); },
  askClear(){ confirmBox('Delete all notes?', "Every note will be removed from this device. This can't be undone.", 'Delete All', () => { S.notes = []; save(); toast('All notes deleted'); go('wall'); }); },
  sound(){ S.settings.sound = !S.settings.sound; save(); render(false); if (S.settings.sound){ buzz(); beep(); } },
  toggleLock(){ if (S.lock.on) setPin('verify', 'off'); else setPin('new1'); },
  changePin(){ setPin('verify', 'change'); },
  lockNow(){ setPin('unlock'); },
  cancelPin(){ go('settings'); },
  forgot(){ confirmBox('Forgot your PIN?', 'The only way back in is to erase all notes and turn the lock off. Your notes will be deleted.', 'Erase & reset', () => { S.notes = []; S.lock = {on:false, salt:'', hash:''}; save(); go('splash'); }); },
  key(t){
    const p = ui.pin, v = t.dataset.v; buzz(6);
    if (v === 'del') p.buf = p.buf.slice(0, -1); else if (p.buf.length < 4) p.buf += v;
    document.querySelectorAll('#dots i').forEach((el, i) => el.classList.toggle('on', i < p.buf.length));
    if (p.buf.length === 4) setTimeout(pinDone, 140);
  }
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t && act[t.dataset.act]) act[t.dataset.act](t); });
document.addEventListener('input', e => {
  const t = e.target, d = ui.draft;
  if (t.id === 'txt'){ d.text = t.value; $('#cc').textContent = t.value.length + '/220'; }
  else if (t.classList.contains('cit')) d.items[+t.dataset.i].t = t.value;
  else if (t.id === 'rem'){ const v = t.value ? new Date(t.value).getTime() : null; d.remind = v && !isNaN(v) ? v : null; }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('cit')){
    if (e.key === 'Enter'){ e.preventDefault(); act.addItem(); }
    else if (e.key === 'Backspace' && !t.value && ui.draft.items.length > 1){ e.preventDefault(); ui.draft.items.splice(+t.dataset.i, 1); render(false); const i = document.querySelectorAll('.cit'); if (i.length) i[Math.max(0, +t.dataset.i - 1)].focus(); }
  } else if (ui.screen === 'lock' && /^[0-9]$/.test(e.key)) act.key({dataset:{v:e.key}});
  else if (ui.screen === 'lock' && e.key === 'Backspace') act.key({dataset:{v:'del'}});
});

render();
</script>
</body>
