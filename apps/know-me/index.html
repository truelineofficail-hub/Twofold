<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#040405">
<title>How Well Do You Know Me?</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --ink:#f6f6f8; --ink2:rgba(246,246,248,.66); --ink3:rgba(246,246,248,.4);
  --line:rgba(255,255,255,.12); --glass:rgba(255,255,255,.06);
  --metal:linear-gradient(180deg,#ffffff 0%,#dcdfe6 40%,#8e929e 100%);
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:#040405;color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
.serif{font-family:var(--serif);font-weight:400}
.metal{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

#bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(70% 30% at 50% 0%,rgba(255,255,255,.07),transparent 70%),
  radial-gradient(60% 30% at 50% 100%,rgba(255,255,255,.04),transparent 70%),#040405;contain:strict}
#bg.plain{background:#000}
#app{position:relative;z-index:1;max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 12px 4px;min-height:58px}
.bar>div:first-child{display:flex;justify-content:flex-start}
.bar .r{display:flex;justify-content:flex-end}
.bar .bt{text-align:center;font-size:12px;letter-spacing:.26em;color:var(--ink2);text-transform:uppercase;font-weight:400}
.bar .bt.s{font-family:var(--serif);font-size:19px;letter-spacing:.01em;text-transform:none;color:var(--ink)}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:background .2s,color .2s}
.ib:active,.ib:focus-visible{background:var(--glass);color:#fff;outline:none}
.prog{height:2px;background:rgba(255,255,255,.08);margin:2px 26px 0;position:relative;border-radius:2px;overflow:hidden}
.prog i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,#8e929e,#fff);transition:transform .6s cubic-bezier(.2,.7,.2,1)}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 24px 24px;display:flex;flex-direction:column;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#screen::-webkit-scrollbar{display:none}
#screen.enter>*{animation:in .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
#nav{display:none;flex:none;margin:0 18px 14px;padding:6px;border-radius:26px;justify-content:space-around;background:rgba(14,14,17,.9);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 8px;border-radius:20px;font-size:11px;letter-spacing:.04em;color:var(--ink3);transition:color .2s,background .2s}
#nav button.on{color:#fff;background:rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}

.glass{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;flex:none;border-radius:20px;font-size:15px;font-weight:500;letter-spacing:.04em;color:#0a0a0c;
  background:linear-gradient(180deg,#fff,#e6e8ee 55%,#b9bdc8);border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 26px rgba(255,255,255,.08),inset 0 1px 0 #fff;transition:transform .15s,opacity .2s}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);opacity:.7;animation:sheen 6s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,55%{transform:translate3d(0,0,0) skewX(-20deg)}100%{transform:translate3d(520%,0,0) skewX(-20deg)}}
.btn:active{transform:scale(.975)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.ghost{color:var(--ink);font-weight:400;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.btn.ghost::after{display:none}
.btn:focus-visible,.row:focus-visible,.chip:focus-visible,.opt:focus-visible,.pill:focus-visible{outline:1px solid #fff;outline-offset:2px}
.link{color:var(--ink2);font-size:13px;padding:14px;text-align:center}
.muted{color:var(--ink2)}
.sub{color:var(--ink2);font-size:14px;margin:8px 0 0;line-height:1.55}
h1,h2,h3{margin:0}
.ttl{font-size:30px;line-height:1.18}
.spacer{flex:1;min-height:14px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--ink3);text-transform:uppercase;margin:0 0 14px}
.gap{height:10px;flex:none}

/* splash */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;text-align:center}
.emblem{width:140px;height:140px;position:relative}
.emblem::before{content:"";position:absolute;inset:-35%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 62%)}
.emblem svg{position:relative;width:100%;height:100%;overflow:visible}
.emblem .orbit{transform-origin:60px 60px;animation:spin 45s linear infinite}
.emblem .beat{transform-origin:60px 62px;animation:beat 4.5s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.05)}}
@keyframes spin{to{transform:rotate(360deg)}}
.splash h1{font-family:var(--serif);font-weight:400;font-size:29px;line-height:1.3;letter-spacing:.06em;margin-top:34px}
.splash .tg{margin:12px 0 0;font-size:11px;letter-spacing:.34em;padding-left:.34em;text-transform:uppercase;color:var(--ink3)}

/* fields */
.field{display:flex;align-items:center;gap:14px;padding:13px 18px;margin-top:14px;border-radius:20px;transition:border-color .2s}
.field label{display:block;font-size:11px;letter-spacing:.06em;color:var(--ink3);margin-bottom:3px}
.field input{width:100%;background:none;border:0;outline:0;font-size:17px;padding:0;font-weight:400}
.field input::placeholder{color:var(--ink3);font-weight:300}
.field:focus-within{border-color:rgba(255,255,255,.5)}
.field .av{color:var(--ink2);flex:none}

/* home */
.hello{font-size:40px;line-height:1.16}
.pills{display:flex;gap:10px;margin-top:6px}
.resume{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:18px;margin-bottom:12px;font-size:13px;color:var(--ink2)}
.resume b{font-weight:400;color:var(--ink)}
.resume i{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;flex:none}
.strip3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:26px;padding:16px 4px}
.strip3 div{text-align:center;position:relative}
.strip3 div+div::before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:1px;background:var(--line)}
.strip3 b{display:block;font-family:var(--serif);font-weight:400;font-size:26px}
.strip3 small{display:block;margin-top:5px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}

/* chips */
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.chip{height:92px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:border-color .2s,background .2s,transform .15s}
.chip:active{transform:scale(.97)}
.chip b{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1}
.chip small{color:var(--ink3);font-size:11px;letter-spacing:.08em}
.chip.on{border-color:rgba(255,255,255,.7);background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.05));box-shadow:0 0 24px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.25)}
.custom{margin-top:14px;padding:14px 18px;border-radius:18px;display:flex;align-items:center;gap:12px}
.custom input{flex:1;background:none;border:0;outline:0;font-size:18px;min-width:0;font-weight:400}
.custom span{color:var(--ink3);font-size:13px}
.note{font-size:12px;color:var(--ink3);margin-top:18px;text-align:center;line-height:1.6}

/* play */
.who{display:flex;justify-content:center}
.tagc{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:8px 16px;border-radius:24px;background:var(--glass);border:1px solid var(--line)}
.tagc i{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
.avatar{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:32px;margin:0 auto 26px;background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.35);box-shadow:0 0 0 8px rgba(255,255,255,.03),0 12px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.big{font-size:38px;line-height:1.16}
.q{font-family:var(--serif);font-size:27px;line-height:1.35;text-align:center;margin:22px 0 26px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:12px 18px;border-radius:20px;text-align:left;font-size:16px;font-weight:400;transition:transform .15s,border-color .2s,background .2s}
.opt:active{transform:scale(.985)}
.opt i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--ink2);border:1px solid var(--line)}
.opt.on{border-color:rgba(255,255,255,.75);background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.06));box-shadow:0 0 26px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.3)}
.opt.on i{background:#fff;color:#0a0a0c;border-color:#fff}
.two .opt{min-height:78px;font-size:19px;font-family:var(--serif);justify-content:center;text-align:center}
.two .opt i{display:none}
.or{align-self:center;font-size:11px;letter-spacing:.3em;color:var(--ink3);margin:-2px 0}

/* reveal */
.rv{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.rp{padding:20px;text-align:center;opacity:0;animation:in .6s cubic-bezier(.2,.7,.2,1) both}
.rp small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
.rp b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;margin-top:8px;line-height:1.3}
.rp.a{animation-delay:.05s} .rp.b{animation-delay:.75s} .rp.v{animation-delay:1.5s}
.verdict{padding:22px 18px;border-radius:22px;text-align:center}
.verdict.ok{background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.55);box-shadow:0 0 34px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.35)}
.verdict.no{background:rgba(255,255,255,.04);border:1px solid var(--line)}
.verdict h3{font-family:var(--serif);font-weight:400;font-size:26px}
.verdict p{margin:6px 0 0;font-size:13px;color:var(--ink2)}
.later{opacity:0;animation:in .5s 2s both}

/* result */
.pct{font-family:var(--serif);font-weight:400;font-size:96px;line-height:1;letter-spacing:-.02em}
.pcs{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink3);margin-top:10px}
.msg{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.5;color:var(--ink2);margin:20px 0 0;max-width:280px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px;width:100%}
.stat{padding:18px 10px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:32px}
.stat small{display:block;color:var(--ink2);font-size:12px;margin-top:6px;line-height:1.4}

/* lists */
.list{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.row{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;text-align:left;width:100%;transition:transform .15s}
.row:active{transform:scale(.985)}
.row .ri{color:var(--ink2);flex:none;display:grid;place-items:center}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:400;font-size:15px}
.row .rt small{display:block;color:var(--ink3);font-size:12px;margin-top:3px;line-height:1.4}
.row .ch{color:var(--ink3);flex:none}
.row .pc{font-family:var(--serif);font-size:22px;flex:none}
.sec{font-size:11px;color:var(--ink3);margin:26px 6px 0;letter-spacing:.2em}
.sw{width:46px;height:28px;border-radius:20px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#9a9ea9;transition:transform .25s,background .25s}
.sw.on{background:rgba(255,255,255,.35)} .sw.on::after{transform:translateX(18px);background:#fff}
.empty{margin:auto 0;text-align:center;color:var(--ink3);font-size:14px;line-height:1.7;padding:40px 10px}
.rev{padding:16px 18px;margin-top:10px}
.rev .rq{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.rev .rq b{font-weight:400}
.rev .rq span{flex:none;font-size:13px;color:var(--ink3)}
.rev .ln{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.5}
.rev .ln em{font-style:normal;color:var(--ink)}
.rev .ok{color:#fff}.rev .no{color:var(--ink3)}
.step{display:flex;gap:16px;align-items:flex-start;padding:12px 0}
.step i{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--ink2);background:var(--glass)}
.step b{display:block;font-weight:400;font-size:15px;margin-top:1px}
.step small{color:var(--ink3);font-size:13px;line-height:1.5}

#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:28px;background:rgba(0,0,0,.75)}
#modal .box{max-width:340px;width:100%;padding:28px 22px 18px;text-align:center;background:rgba(16,16,19,.98);animation:in .3s both}
#modal h3{font-family:var(--serif);font-weight:400;font-size:22px}
#modal p{color:var(--ink2);font-size:14px;line-height:1.6;margin:10px 0 22px}
#modal .acts{display:flex;gap:10px}
#modal .acts .btn{height:48px}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,10px);z-index:30;padding:11px 18px;border-radius:16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;background:rgba(18,18,21,.97);border:1px solid var(--line);white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

#hubNav{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:14px;z-index:15;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  opacity:.55;transition:opacity .2s,background .2s;touch-action:manipulation}
#hubNav:active{opacity:1;background:rgba(255,255,255,.16)}
@media (min-width:431px){#hubNav{left:calc(50% - 205px + 14px)}}
</style>
</head>

<script>
/* ================= QUESTIONS ================= */
/* This-or-that pairs: subject picks one, partner guesses. */
const PAIRS = [

["ideal night in",["A movie","Games","Cooking","Deep talk"]],

["biggest dream",["Travel the world","Build something","A peaceful home","Be known for something"]]
];
const QS = [...PAIRS.map(p => ({t:'', o:p})), ...TOPICS.map(t => ({t:t[0], o:t[1]}))];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ================= STATE ================= */
const KEY = 'know-me-v1';
const DEF = {names:['',''], settings:{sound:true, turns:10}, game:null, history:[], used:[]};
let S = load();
function load(){
  try{ const r = JSON.parse(localStorage.getItem(KEY)); if (r) return {...JSON.parse(JSON.stringify(DEF)), ...r, settings:{...DEF.settings, ...(r.settings||{})}}; }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const ui = {screen: S.game ? 'play' : 'splash', sel: String(S.settings.turns), custom: '', pick: null, res: 0, detail: 0, from: null};

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N = i => esc(S.names[i] || 'Player ' + (i+1));
const fmtDate = ts => new Date(ts).toLocaleDateString(undefined, {day:'numeric', month:'short'});
let ac;
function beep(f=520, d=.14, v=.035){
  if (!S.settings.sound) return;
  try{ ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(); o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(v, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+d); }catch(e){}
}
function buzz(ms=14){ if (S.settings.sound && navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }
let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1900); }
function confirmBox(title, msg, ok, cb){
  const m = $('#modal');
  m.innerHTML = `<div class="box glass"><h3>${title}</h3><p>${msg}</p><div class="acts"><button class="btn ghost" data-m="no">Cancel</button><button class="btn" data-m="yes">${ok}</button></div></div>`;
  m.style.display = 'flex';
  m.onclick = e => { const b = e.target.closest('[data-m]'); if (!b && e.target !== m) return; m.style.display = 'none'; if (b && b.dataset.m === 'yes') cb(); };
}
/* never repeat a question until all have been used, then start over */
function pickQuestion(){
  let avail = QS.map((_, i) => i).filter(i => !S.used.includes(i));
  if (!avail.length){ S.used = []; avail = QS.map((_, i) => i); }
  const i = avail[Math.floor(Math.random() * avail.length)];
  S.used.push(i);
  return QS[i];
}
const sv = (p, s=22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

function bar({back, title, serif, gear, act}){
  const l = back ? `<button class="ib" data-act="${act||'go'}" data-v="${back}" aria-label="Back">${ic.back}</button>` : '';
  const r = gear ? `<button class="ib" data-act="go" data-v="settings" aria-label="Settings">${ic.gear}</button>` : '';
  return `<div class="bar"><div>${l}</div><div class="bt ${serif?'s':''}">${title||''}</div><div class="r">${r}</div></div>`;
}
const navHTML = sc => { const on = {home:'home', gsetup:'home', history:'history', detail:'history', settings:'settings'}[sc];
  return [['home','Play',ic.play],['history','History',ic.clock],['settings','Settings',ic.gear]]
    .map(([v,l,i]) => `<button data-act="go" data-v="${v}" class="${on===v?'on':''}">${i}<span>${l}</span></button>`).join(''); };
function chipsHTML(){
  const c = v => `<button class="chip glass ${ui.sel===v?'on':''}" data-act="chip" data-v="${v}"><b>${v==='custom'?'Custom':v}</b><small>${v==='custom'?'your number':'questions'}</small></button>`;
  return `<div class="chips">${c('6')}${c('10')}${c('16')}${c('custom')}</div>` +

}
const chosenTotal = () => { const n = ui.sel==='custom' ? parseInt(ui.custom,10) : parseInt(ui.sel,10); return (n>=2 && n<=40) ? n : null; };
const pct = (m, t) => t ? Math.round(100 * m / t) : 0;
const optsHTML = (q, sel) => {
  const two = q.o.length === 2;
  return `<div class="opts ${two?'two':''}">` + q.o.map((t, i) => `${two && i===1 ? '<div class="or">OR</div>' : ''}<button class="opt glass ${sel===i?'on':''}" data-act="pickOpt" data-v="${i}"><i>${'ABCD'[i]}</i><span>${esc(t)}</span></button>`).join('') + `</div>`;
};

/* ================= RENDER ================= */
function render(anim=true){
  const r = SC[ui.screen]();
  $('#top').innerHTML = r.top || '';
  const sc = $('#screen'); sc.innerHTML = r.body;
  const nv = $('#nav'); nv.style.display = r.nav ? 'flex' : 'none'; nv.innerHTML = r.nav ? navHTML(ui.screen) : '';
  $('#bg').classList.toggle('plain', !!r.plain);
  if (anim){ sc.classList.remove('enter'); void sc.offsetWidth; sc.classList.add('enter'); sc.scrollTop = 0; }
}
function go(s){
  ui.screen = s; ui.pick = null;
  if (s === 'gsetup'){ const n = S.settings.turns; ui.sel = [6,10,16].includes(n) ? String(n) : 'custom'; ui.custom = String(n); }
  render();
}

/* ================= GAME LOGIC ================= */
function startGame(total){
  S.settings.turns = total;
  S.game = {id: Date.now(), total, idx: 0, phase: 'intro', cur: pickQuestion(), ans: null, guess: null, items: []};
  ui.pick = null; save(); ui.screen = 'play'; render();
}
function finishGame(){
  const g = S.game, k = [0,0], n = [0,0];
  g.items.forEach(x => { n[x.s]++; if (x.ok) k[x.s]++; });
  const m = k[0] + k[1];
  S.history.unshift({id: g.id, total: g.total, names: [S.names[0], S.names[1]], pct: pct(m, g.total), k, n, items: g.items});
  S.history = S.history.slice(0, 60);
  S.game = null; ui.res = 0; ui.from = null; save(); ui.screen = 'result'; render();
}
const act = {
  start(){ go(S.names[0] && S.names[1] ? 'home' : 'names'); },
  go(t){ ui.from = null; go(t.dataset.v); },
  saveNames(){
    const a = $('#n1').value.trim(), b = $('#n2').value.trim();
    if (!a || !b){ toast('Add both names to continue'); const f = $('.field'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); return; }
    S.names = [a, b]; save(); const back = ui.from; ui.from = null; go(back || 'home');
  },
  editNames(){ ui.screen = 'names'; ui.from = 'settings'; render(); },
  newGame(){ go('gsetup'); },
  resume(){ go('play'); },
  chip(t){ ui.sel = t.dataset.v; render(false); const c = $('#customN'); if (c) c.focus(); },
  startGame(){ const n = chosenTotal(); if (!n) return toast('Choose 2 to 40 questions'); startGame(n); },
  pickOpt(t){ ui.pick = parseInt(t.dataset.v, 10); buzz(8); render(false); },
  ready(){ const g = S.game; if (g && g.phase === 'intro'){ g.phase = 'ask'; ui.pick = null; save(); render(); } },
  lock(){ const g = S.game; if (!g || g.phase !== 'ask' || ui.pick == null) return; g.ans = ui.pick; ui.pick = null; g.phase = 'pass'; save(); buzz(); beep(470); render(); },
  passReady(){ const g = S.game; if (g && g.phase === 'pass'){ g.phase = 'guess'; ui.pick = null; save(); render(); } },
  lockGuess(){
    const g = S.game; if (!g || g.phase !== 'guess' || ui.pick == null) return;
    g.guess = ui.pick; ui.pick = null;
    const sub = g.idx % 2, q = g.cur;
    g.items.push({q: q.t ? cap(q.t) : q.o.join(' or '), s: sub, a: q.o[g.ans], g: q.o[g.guess], ok: g.guess === g.ans});
    g.phase = 'reveal'; save(); render();
    const ok = g.guess === g.ans; setTimeout(() => { buzz(ok ? 30 : 12); beep(ok ? 700 : 300, .22, .04); }, 1500);
  },
  next(){
    const g = S.game; if (!g || g.phase !== 'reveal') return;
    if (g.idx + 1 >= g.total) return finishGame();
    g.idx++; g.cur = pickQuestion(); g.ans = null; g.guess = null; g.phase = 'intro'; ui.pick = null; save(); render();
  },
  leave(){ confirmBox('Leave game?', 'Your progress is saved. You can resume from Home.', 'Leave', () => go('home')); },
  seeAnswers(){ ui.detail = ui.res; ui.from = 'result'; ui.screen = 'detail'; render(); },
  again(){ const r = S.history[ui.res]; startGame(r ? r.total : S.settings.turns); },
  homeAfter(){ go('home'); },
  detail(t){ ui.detail = parseInt(t.dataset.v, 10); ui.from = null; go('detail'); },
  sound(){ S.settings.sound = !S.settings.sound; save(); render(false); if (S.settings.sound){ buzz(); beep(); } },
  reset(){ confirmBox('Reset data?', 'This clears your game history and any game in progress. Your names stay.', 'Reset', () => { S.history = []; S.game = null; S.used = []; save(); toast('Data reset'); render(false); }); }
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t && act[t.dataset.act]) act[t.dataset.act](t); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'n1') $('#n2').focus();
  else if (e.key === 'Enter' && e.target.id === 'n2') act.saveNames();
});
document.addEventListener('input', e => { if (e.target.id === 'customN') ui.custom = e.target.value; });

render();
</script>
</body>
</html>
